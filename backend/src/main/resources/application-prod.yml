spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10        # Render Free PostgreSQL лимит ~25. 10 коннектов — безопасный максимум.
      minimum-idle: 2
      connection-timeout: 10000    # Fail-fast: 10s. Не режем легитимные запросы, но не висим 20s под DDoS.
      idle-timeout: 300000
      max-lifetime: 1200000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

server:
  tomcat:
    threads:
      max: 25          # Дефолт 200 убивает 0.1 CPU context switching-ом.
      min-spare: 5

jwt:
  secret: ${JWT_SECRET}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  pro-price-id: ${STRIPE_PRO_PRICE_ID}

kaspi:
  merchant-id: ${KASPI_MERCHANT_ID}
  secret-key: ${KASPI_SECRET_KEY}
  pro-price-amount: 15000

encryption:
  secret: ${ENCRYPTION_SECRET}
  secret-old: ${ENCRYPTION_SECRET_OLD:}

groq:
  api-key: ${GROQ_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://me-dev-two.vercel.app}

app:
  frontend-url: ${FRONTEND_URL:https://me-dev-two.vercel.app}