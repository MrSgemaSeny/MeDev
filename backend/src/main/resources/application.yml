spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medev}
    username: ${DATABASE_USERNAME:test_user}
    password: ${DATABASE_PASSWORD:pass1}
  jpa:
    hibernate:
      ddl-auto: validate          # НИКОГДА create — только Flyway
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    user:
      name: user
      password: stub_password_to_suppress_log

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_256_bits_long_for_hs256_algorithm_12345}
  expiration: 86400000            # 24 часа
  refresh-expiration: 2592000000  # 30 дней

github:
  api-url: https://api.github.com

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_123}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_123}
