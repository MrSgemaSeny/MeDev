spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: user
      password: stub_password_to_suppress_log
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder_client_id}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder_client_secret}
            scope: read:user,user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder_google_client_secret}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
        initialize-schema: false

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

jwt:
  expiration: 900000              # 15 минут
  refresh-expiration: 2592000000  # 30 дней

encryption:
  secret: ${ENCRYPTION_SECRET:super_secret_encryption_key_that_is_at_least_32_bytes_long_12345}
  secret-old: ${ENCRYPTION_SECRET_OLD:}

github:
  api-url: https://api.github.com

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_12345}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_12345}
  pro-price-id: ${STRIPE_PRO_PRICE_ID:price_12345}

kaspi:
  merchant-id: ${KASPI_MERCHANT_ID:dummy-merchant}
  secret-key: ${KASPI_SECRET_KEY:dummy-secret-key}
  pro-price-amount: 15000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://me-dev-two.vercel.app}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
