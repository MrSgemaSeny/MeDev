<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.fullName} + ' - Apple Resume'">Apple Modern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0071e3;
            --border-light: #d2d2d7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            max-width: 1040px;
            margin: 0 auto;
            padding: 80px 40px;
        }
        
        /* Header */
        .hero { margin-bottom: 80px; text-align: center; }
        h1 { font-size: 48px; font-weight: 700; letter-spacing: -1px; margin-bottom: 16px; }
        .hero-meta { display: flex; justify-content: center; gap: 24px; color: var(--text-secondary); font-size: 15px; }
        .hero-meta a { color: var(--accent-blue); text-decoration: none; }
        .hero-meta a:hover { text-decoration: underline; }
        
        /* Sticky Section Layout */
        .spec-section {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 40px;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .spec-section:last-child { border-bottom: none; }
        
        .sticky-label {
            position: sticky;
            top: 40px;
            height: max-content;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        
        /* Content formatting */
        .summary-text { font-size: 21px; line-height: 1.5; color: var(--text-secondary); font-weight: 400; letter-spacing: -0.3px; }
        
        .spec-item { display: flex; flex-direction: column; gap: 8px; }
        .item-row { display: flex; justify-content: space-between; align-items: baseline; }
        .item-title { font-size: 21px; font-weight: 600; letter-spacing: -0.3px; }
        .item-date { color: var(--text-secondary); font-size: 15px; }
        .item-subtitle { font-size: 17px; font-weight: 500; }
        .item-desc { font-size: 15px; color: var(--text-primary); margin-top: 8px; }
        
        .spec-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .spec-tag { background: #f5f5f7; color: var(--text-primary); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        
        .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .skill-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; }
        
        @media (max-width: 768px) {
            .spec-section { grid-template-columns: 1fr; gap: 16px; padding: 32px 0; }
            .sticky-label { position: relative; top: 0; font-size: 24px; }
            .hero-meta { flex-direction: column; gap: 8px; }
            body { padding: 40px 20px; }
            .skills-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    
    <div class="hero">
        <h1 th:text="${profile.fullName}">Name</h1>
        <div class="hero-meta">
            <span th:if="${profile.location}" th:text="${profile.location}"></span>
            <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></span>
            <span th:if="${profile.githubUsername}">GH: <span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}">IN: <span th:text="${profile.linkedin}"></span></span>
        </div>
    </div>

    <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','projects'}}">
        <th:block th:switch="${sectionName}">
            
            <div class="spec-section" th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                <div class="sticky-label">Overview</div>
                <div class="content-area">
                    <div class="summary-text" th:text="${profile.summary}"></div>
                </div>
            </div>

            <div class="spec-section" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                <div class="sticky-label">Experience</div>
                <div class="content-area">
                    <div class="spec-item" th:each="exp : ${profile.experience}">
                        <div class="item-row">
                            <div class="item-title" th:text="${exp.position}"></div>
                            <div class="item-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                        </div>
                        <div class="item-subtitle" th:text="${exp.company}"></div>
                        <div class="item-desc" th:text="${exp.description}"></div>
                        <div class="spec-tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                            <span class="spec-tag" th:text="${exp.techStack}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="spec-section" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                <div class="sticky-label">Education</div>
                <div class="content-area">
                    <div class="spec-item" th:each="edu : ${profile.education}">
                        <div class="item-row">
                            <div class="item-title" th:text="${edu.institution}"></div>
                            <div class="item-date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                        </div>
                        <div class="item-subtitle" th:text="${edu.field != null and !edu.field.isEmpty() ? edu.degree + ' in ' + edu.field : edu.degree}"></div>
                    </div>
                </div>
            </div>

            <div class="spec-section" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                <div class="sticky-label">Core Skills</div>
                <div class="content-area skills-grid">
                    <div th:each="entry : ${groupedSkills}">
                        <div class="skill-title" th:text="${entry.key}"></div>
                        <div class="spec-tags" style="margin-top:0;">
                            <span class="spec-tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="spec-section" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                <div class="sticky-label">Projects</div>
                <div class="content-area">
                    <div class="spec-item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <div class="item-row">
                            <div class="item-title" th:text="${proj.name}"></div>
                            <div class="item-date">
                                <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank" style="color:var(--accent-blue); text-decoration:none;">GitHub</a>
                                <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank" style="color:var(--accent-blue); text-decoration:none; margin-left:12px;">Live Demo</a>
                            </div>
                        </div>
                        <div class="item-desc" th:text="${proj.description}"></div>
                        <div class="spec-tags" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                            <span class="spec-tag" th:text="${proj.techStack}"></span>
                        </div>
                    </div>
                </div>
            </div>

        </th:block>
    </th:block>

</body>
</html>
