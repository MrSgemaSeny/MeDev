<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.fullName} + ' - Editorial Resume'">Editorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfcf9;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --accent: #2c5e50;
            --border-color: #e0ded8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            padding: 0;
            margin: 0;
        }
        .magazine-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 60px;
        }
        
        /* Sticky Sidebar */
        .sidebar {
            position: sticky;
            top: 60px;
            height: max-content;
            border-right: 1px solid var(--border-color);
            padding-right: 40px;
        }
        h1.name {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            line-height: 1.1;
            margin-bottom: 24px;
            color: var(--text-primary);
        }
        .byline {
            font-size: 15px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 32px;
        }
        .contact-group {
            margin-bottom: 16px;
        }
        .contact-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        .contact-value, .contact-value a {
            font-size: 15px;
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .contact-value a:hover { color: var(--accent); }
        
        /* Main Content */
        .content-stream {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }
        
        h2.section-header {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--accent);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        
        /* Summary Pull-Quote */
        .pull-quote {
            font-size: 22px;
            line-height: 1.6;
            font-style: italic;
            color: var(--text-primary);
            border-left: 4px solid var(--accent);
            padding-left: 24px;
            margin: 0 0 20px 0;
        }
        
        /* Experience Flow (No Cards) */
        .exp-entry {
            margin-bottom: 40px;
            position: relative;
        }
        .exp-entry:last-child { margin-bottom: 0; }
        .exp-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        .exp-title {
            font-size: 20px;
            font-weight: 600;
        }
        .exp-date {
            font-size: 14px;
            color: var(--text-secondary);
            font-style: italic;
        }
        .exp-company {
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .exp-desc {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .exp-tech {
            font-size: 13px;
            font-family: sans-serif;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Skills Small Caps */
        .skills-prose {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .skill-cat {
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 8px;
        }
        .skill-items {
            font-variant: small-caps;
            letter-spacing: 0.5px;
            font-size: 16px;
        }

        /* Projects Grid */
        .proj-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }
        .proj-item {
            border-top: 2px solid var(--border-color);
            padding-top: 16px;
        }
        .proj-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .proj-name {
            font-size: 18px;
            font-weight: 600;
        }
        .proj-links a {
            font-size: 13px;
            font-family: sans-serif;
            text-transform: uppercase;
            color: var(--accent);
            text-decoration: none;
            margin-left: 12px;
        }
        .proj-desc { font-size: 14px; color: var(--text-secondary); }

        @media (max-width: 900px) {
            .magazine-wrapper { grid-template-columns: 1fr; gap: 40px; }
            .sidebar { position: relative; top: 0; border-right: none; border-bottom: 1px solid var(--border-color); padding-right: 0; padding-bottom: 30px; }
            .proj-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="magazine-wrapper">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="name" th:text="${profile.fullName}">Name</h1>
            <div class="byline" th:if="${profile.location}" th:text="${profile.location}">Location</div>
            
            <div class="contact-group" th:if="${profile.website}">
                <span class="contact-label">Website</span>
                <span class="contact-value"><a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></span>
            </div>
            <div class="contact-group" th:if="${profile.githubUsername}">
                <span class="contact-label">GitHub</span>
                <span class="contact-value"><a th:href="'https://github.com/' + ${profile.githubUsername}" th:text="${profile.githubUsername}" target="_blank"></a></span>
            </div>
            <div class="contact-group" th:if="${profile.linkedin}">
                <span class="contact-label">LinkedIn</span>
                <span class="contact-value" th:text="${profile.linkedin}"></span>
            </div>
            <div class="contact-group" th:if="${profile.telegram}">
                <span class="contact-label">Telegram</span>
                <span class="contact-value" th:text="${profile.telegram}"></span>
            </div>
        </aside>

        <!-- Right Content Stream -->
        <main class="content-stream">
            <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
                <th:block th:switch="${sectionName}">
                    
                    <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                        <blockquote class="pull-quote" th:text="${profile.summary}"></blockquote>
                    </div>

                    <section th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                        <h2 class="section-header">Professional Experience</h2>
                        <div class="exp-entry" th:each="exp : ${profile.experience}">
                            <div class="exp-header">
                                <div class="exp-title" th:text="${exp.position}"></div>
                                <div class="exp-date" th:text="${exp.startDate + ' — ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                            </div>
                            <div class="exp-company" th:text="${exp.company}"></div>
                            <div class="exp-desc" th:text="${exp.description}"></div>
                            <div class="exp-tech" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}" th:text="${'Tech: ' + exp.techStack}"></div>
                        </div>
                    </section>

                    <section th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                        <h2 class="section-header">Education</h2>
                        <div class="exp-entry" th:each="edu : ${profile.education}">
                            <div class="exp-header">
                                <div class="exp-title" th:text="${edu.institution}"></div>
                                <div class="exp-date" th:text="${edu.startDate + ' — ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                            </div>
                            <div class="exp-desc" th:text="${edu.degree} + (edu.fieldOfStudy != null ? ' in ' + edu.fieldOfStudy : '')"></div>
                        </div>
                    </section>

                    <section th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                        <h2 class="section-header">Capabilities & Tools</h2>
                        <div class="skills-prose">
                            <div style="margin-bottom: 12px;" th:each="entry : ${groupedSkills}">
                                <span class="skill-cat" th:text="${entry.key + ':'}"></span>
                                <span class="skill-items">
                                    <th:block th:each="skillName, iterStat : ${entry.value}">
                                        <span th:text="${skillName}"></span><span th:if="${!iterStat.last}">, </span>
                                    </th:block>
                                </span>
                            </div>
                        </div>
                    </section>

                    <section th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                        <h2 class="section-header">Languages</h2>
                        <div class="skills-prose" th:text="${languagesStr}"></div>
                    </section>

                    <section th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                        <h2 class="section-header">Selected Works</h2>
                        <div class="proj-grid">
                            <div class="proj-item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                                <div class="proj-header">
                                    <div class="proj-name" th:text="${proj.name}"></div>
                                    <div class="proj-links">
                                        <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank">GH</a>
                                        <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank">LIVE</a>
                                    </div>
                                </div>
                                <div class="proj-desc" th:text="${proj.description}"></div>
                                <div class="exp-tech" style="margin-top: 8px;" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}" th:text="${proj.techStack}"></div>
                            </div>
                        </div>
                    </section>

                </th:block>
            </th:block>
        </main>
    </div>
</body>
</html>
