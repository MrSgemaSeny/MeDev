<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.fullName} + ' - Milky Soft Resume'">Milky Soft Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9f6f0;
            --text-primary: #3e3a37;
            --text-secondary: #706b65;
            --accent-sage: #8da191;
            --accent-dusty: #d4b7a1;
            --border-color: #e5ded3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        a {
            color: var(--accent-sage);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
        }
        a:hover {
            border-bottom-color: var(--accent-sage);
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 50px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 24px;
            color: var(--text-secondary);
            font-size: 14px;
            font-style: italic;
        }
        .contact-info a {
            color: var(--accent-sage);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .contact-info a:hover { opacity: 0.7; }
        
        .layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 60px;
        }
        
        h2.section-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        h2.section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background-color: var(--border-color);
        }
        
        .summary-text {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            font-style: italic;
            margin-bottom: 40px;
        }
        
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .item-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .item-meta {
            display: flex;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
            font-style: italic;
        }
        .item-desc {
            font-size: 15px;
            color: var(--text-primary);
        }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }
        .tag {
            background-color: transparent;
            color: var(--accent-sage);
            border: 1px solid var(--accent-sage);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-family: -apple-system, sans-serif;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
        }
        .skill-group {
            background-color: #fcfbf9;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 8px;
        }
        .skill-group-name {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--accent-dusty);
        }
        
        @media (max-width: 768px) {
            body { padding: 40px 20px; }
            h1 { font-size: 40px; }
            .contact-info { flex-direction: column; align-items: center; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${profile.fullName}">Name</h1>
        <div class="contact-info">
            <span th:if="${profile.location}" th:text="${profile.location}"></span>
            <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></span>
            <span th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}">in/<span th:text="${profile.linkedin}"></span></span>
            <span th:if="${profile.telegram}">tg/<span th:text="${profile.telegram}"></span></span>
        </div>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
        <th:block th:switch="${sectionName}">
            
            <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                <div class="summary-text" th:text="${profile.summary}"></div>
            </div>

            <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}" style="margin-bottom: 60px;">
                <h2 class="section-title">Experience</h2>
                <div class="item-list">
                    <div class="item" th:each="exp : ${profile.experience}">
                        <div class="item-header">
                            <div class="item-title" th:text="${exp.position}">Position</div>
                            <div class="item-meta">
                                <span th:text="${exp.company}">Company</span>
                                <span>&middot;</span>
                                <span th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</span>
                            </div>
                        </div>
                        <div class="item-desc" th:text="${exp.description}">Description</div>
                        <div class="tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                            <span class="tag" th:text="${exp.techStack}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}" style="margin-bottom: 60px;">
                <h2 class="section-title">Education</h2>
                <div class="item-list">
                    <div class="item" th:each="edu : ${profile.education}">
                        <div class="item-header">
                            <div class="item-title" th:text="${edu.institution}">Institution</div>
                            <div class="item-meta">
                                <span th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</span>
                                <span>&middot;</span>
                                <span th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}" style="margin-bottom: 40px;">
                <h2 class="section-title">Skills</h2>
                <div class="skills-grid">
                    <div class="skill-group" th:each="entry : ${groupedSkills}">
                        <div class="skill-group-name" th:text="${entry.key}"></div>
                        <div class="tags" style="margin-top:0;">
                            <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}" style="border-color: var(--border-color); color: var(--text-secondary);"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}" style="margin-bottom: 40px;">
                <h2 class="section-title">Languages</h2>
                <div style="font-size: 16px; font-style: italic; color: var(--accent-sage);" th:text="${languagesStr}"></div>
            </div>

            <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}" style="margin-bottom: 40px;">
                <h2 class="section-title">Projects</h2>
                <div class="item-list">
                    <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <div class="item-header">
                            <div class="item-title" th:text="${proj.name}">Project</div>
                            <div class="item-meta">
                                <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank">View Code</a>
                                <span th:if="${proj.githubUrl != null and proj.liveUrl != null}">&middot;</span>
                                <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank">Live Demo</a>
                            </div>
                        </div>
                        <div class="item-desc" th:text="${proj.description}">Description</div>
                        <div class="tags" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                            <span class="tag" th:text="${proj.techStack}"></span>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
