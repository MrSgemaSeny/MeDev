<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - Hero Resume'">PH Orange</title>
    <style>
        /* Removed CSS variables as they are not supported by Flying Saucer CSS 2.1 */
        @page { margin: 0; background-color: #000000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            padding: 40px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Hero Header */
        .hero-section {
            padding: 40px 0;
            border-bottom: 2px solid #333;
            text-align: center;
            margin-bottom: 60px;
        }
        .hero-name {
            font-family: 'Anton', Roboto, sans-serif;
            font-size: 64px;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }
        .hero-name span.accent { color: #ffa31a; }
        .hero-contact {
            font-size: 16px;
            font-weight: 600;
            color: #888888;
            text-align: center;
        }
        .hero-contact span { display: inline-block; margin: 0 12px 12px 12px; }
        .hero-contact a { color: #ffffff; text-decoration: none; }
        .hero-contact a:hover { color: #ffa31a; }
        
        /* Section Titles */
        .section-title {
            font-family: 'Anton', Roboto, sans-serif;
            font-size: 32px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 32px;
        }
        .section-title span { color: #ffa31a; }
        
        /* Block Wrappers */
        .section-block { margin-bottom: 60px; display: table; width: 100%; table-layout: fixed; }
        .title-col { display: table-cell; width: 25%; vertical-align: top; padding-right: 20px; }
        .content-col { display: table-cell; width: 75%; vertical-align: top; }
        
        .summary-txt {
            font-size: 20px;
            font-weight: 400;
            line-height: 1.6;
            border-left: 4px solid #ffa31a;
            padding-left: 20px;
        }
        
        /* Entries */
        .entry { margin-bottom: 32px; page-break-inside: avoid; }
        .entry:last-child { margin-bottom: 0; }
        
        .entry-header { width: 100%; display: table; margin-bottom: 8px; }
        .entry-title { display: table-cell; font-size: 22px; font-weight: 800; color: #ffa31a; text-transform: uppercase; }
        .entry-date { display: table-cell; font-size: 14px; font-weight: 600; color: #888888; text-align: right; vertical-align: bottom; }
        
        .entry-subtitle { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #ffffff; }
        .entry-desc { font-size: 16px; color: #ccc; line-height: 1.6; margin-bottom: 12px; }
        
        .hero-tags { margin-top: 8px; }
        .hero-tag {
            display: inline-block;
            background: #ffa31a;
            color: #000;
            padding: 4px 12px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        /* Posters / Grids */
        .poster-card {
            display: inline-block;
            width: 48%;
            vertical-align: top;
            background: #111;
            border: 2px solid #333;
            padding: 24px;
            margin-bottom: 16px;
            margin-right: 1%;
            box-sizing: border-box;
            page-break-inside: avoid;
        }
        
        .pc-title {
            font-size: 24px;
            font-family: 'Anton', Roboto, sans-serif;
            text-transform: uppercase;
            margin-bottom: 12px;
            width: 100%;
            display: table;
        }
        .pc-name { display: table-cell; }
        .pc-links { display: table-cell; text-align: right; }
        .pc-links a { color: #ffa31a; font-size: 14px; font-family: 'Inter', Roboto, sans-serif; text-decoration: none; margin-left: 12px; }
        
        /* Single Page Overrides */
        body.single-page { padding: 24px; }
        .single-page .hero-section { padding: 20px 0; margin-bottom: 24px; }
        .single-page .hero-avatar { width: 72px !important; height: 72px !important; margin-bottom: 12px !important; }
        .single-page .hero-name { font-size: 40px; margin-bottom: 12px; }
        .single-page .hero-contact { font-size: 11px; }
        .single-page .hero-contact span { margin: 0 8px 8px 8px; }
        .single-page .section-block { margin-bottom: 24px; page-break-inside: auto; }
        .single-page .section-title { font-size: 20px; margin-bottom: 16px; padding-bottom: 4px; }
        .single-page .summary-txt { font-size: 13px; padding-left: 12px; }
        .single-page .entry { margin-bottom: 16px; }
        .single-page .entry-title { font-size: 15px; }
        .single-page .entry-date { font-size: 11px; }
        .single-page .entry-subtitle { font-size: 13px; margin-bottom: 4px; }
        .single-page .entry-desc { font-size: 11.5px; margin-bottom: 6px; }
        .single-page .hero-tag { font-size: 10px; padding: 2px 8px; margin-right: 4px; margin-bottom: 4px; }
        .single-page .poster-card { padding: 12px; margin-bottom: 12px; }
        .single-page .pc-title { font-size: 16px; margin-bottom: 8px; }
        .single-page .pc-links a { font-size: 10.5px; margin-left: 8px; }
    </style>
</head>
<body th:classappend="${singlePage != null and singlePage} ? 'single-page' : 'multi-page'">
    <div class="container">
        <header class="hero-section">
            <div class="hero-avatar" th:if="${profile.githubUsername != null}" style="width: 120px; height: 120px; border-radius: 50%; overflow: hidden; margin: 0 auto 24px auto; border: 2px solid #ffa31a;">
                <img th:src="${avatarBase64 ?: 'https://github.com/' + profile.githubUsername + '.png'}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; vertical-align: middle;" />
            </div>
            <div class="hero-name">
                <span th:text="${profile.fullName != null ? profile.fullName.split(' ')[0] : ''}"></span>
                <th:block th:if="${profile.fullName != null and profile.fullName.split(' ').length gt 1}">
                    <span class="accent" th:text="${profile.fullName.substring(profile.fullName.indexOf(' ') + 1)}"></span>
                </th:block>
            </div>
            <div class="hero-contact">
                <span th:if="${profile.location}" th:text="${profile.location}"></span>
                <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></span>
                <span th:if="${profile.githubUsername}">GH/ <a th:href="'https://github.com/' + ${profile.githubUsername}" th:text="${profile.githubUsername}" target="_blank"></a></span>
                <span th:if="${profile.linkedin}">IN/ <span th:text="${profile.linkedin}"></span></span>
            </div>
        </header>

        <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','projects'}}">
            <th:block th:switch="${sectionName}">
                
                <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}" style="margin-bottom: 60px; page-break-inside: avoid;">
                    <h2 class="section-title"><span>01.</span> PROFILE</h2>
                    <div style="font-size: 18px; font-weight: 400; line-height: 1.6; color: #ddd; border-left: 4px solid #ffa31a; padding-left: 24px;" th:text="${profile.summary}"></div>
                </div>
                <div class="section-block" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <div class="title-col">
                        <h2 class="section-title"><span>02.</span> WORK</h2>
                    </div>
                    <div class="content-col">
                        <div class="entry" th:each="exp : ${profile.experience}">
                            <div class="entry-header">
                                <div class="entry-title" th:text="${exp.position}"></div>
                                <div class="entry-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                            </div>
                            <div class="entry-subtitle" th:text="${exp.company}"></div>
                            <div class="entry-desc" th:text="${exp.description}"></div>
                            <div class="hero-tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                                <span class="hero-tag" th:text="${exp.techStack}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-block" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <div class="title-col">
                        <h2 class="section-title"><span>03.</span> EDU</h2>
                    </div>
                    <div class="content-col">
                        <div class="entry" th:each="edu : ${profile.education}">
                            <div class="entry-header">
                                <div class="entry-title" th:text="${edu.institution}"></div>
                                <div class="entry-date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                            </div>
                            <div class="entry-subtitle" th:text="${edu.field != null and !edu.field.isEmpty() ? edu.degree + ' in ' + edu.field : edu.degree}"></div>
                        </div>
                    </div>
                </div>

                <div class="section-block" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <div class="title-col">
                        <h2 class="section-title"><span>04.</span> SKILLS</h2>
                    </div>
                    <div class="content-col">
                        <div class="entry" th:each="entry : ${groupedSkills}">
                            <div class="entry-header">
                                <div class="entry-title" th:text="${entry.key}"></div>
                            </div>
                            <div class="hero-tags" style="margin-top:4px;">
                                <span class="hero-tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-block" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <div class="title-col">
                        <h2 class="section-title"><span>05.</span> BUILDS</h2>
                    </div>
                    <div class="content-col">
                        <div class="entry" th:each="proj, stat : ${profile.projects}" th:if="${proj.isVisible and stat.index < 3}">
                            <div class="entry-header">
                                <div class="entry-title" th:text="${proj.name}"></div>
                                <div class="entry-date">
                                    <a style="color:#ffa31a;text-decoration:none;margin-left:12px;font-size:14px;" th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank">GIT</a>
                                    <a style="color:#ffa31a;text-decoration:none;margin-left:12px;font-size:14px;" th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank">LIVE</a>
                                </div>
                            </div>
                            <div class="entry-desc" th:text="${proj.description}"></div>
                            <div class="hero-tags" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                <span class="hero-tag" th:text="${proj.techStack}"></span>
                            </div>
                        </div>
                    </div>
                </div>

            </th:block>
        </th:block>

    </div>
</body>
</html>
