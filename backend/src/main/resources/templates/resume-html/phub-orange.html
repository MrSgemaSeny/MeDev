<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.fullName} + ' - PH Resume'">PH Orange Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-orange: #ffa31a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
        }
        a {
            color: var(--accent-orange);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.8; }
        .hero {
            text-align: center;
            margin-bottom: 60px;
        }
        .logo {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 56px;
            text-transform: lowercase;
            letter-spacing: -2px;
            margin-bottom: 16px;
            display: inline-block;
        }
        .logo-w1 { color: #ffffff; }
        .logo-w2 {
            background-color: var(--accent-orange);
            color: #000000;
            padding: 0 12px;
            border-radius: 8px;
            margin-left: 4px;
        }
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 700;
        }
        .contact-info a {
            color: var(--accent-orange);
            text-decoration: none;
        }
        
        .section {
            margin-bottom: 40px;
        }
        h2.section-title {
            background-color: var(--accent-orange);
            color: #000000;
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 20px;
            text-transform: uppercase;
            padding: 8px 16px;
            display: inline-block;
            border-radius: 4px;
            margin-bottom: 30px;
        }
        
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
        }
        .item-left {
            display: flex;
            flex-direction: column;
        }
        .item-right {
            text-align: right;
            color: var(--accent-orange);
            font-weight: 700;
            font-size: 14px;
        }
        
        .item-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .item-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .item-desc {
            font-size: 15px;
            color: #dddddd;
            grid-column: 1 / -1;
        }
        
        .tags {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .tag {
            border: 2px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 4px 10px;
            font-weight: 700;
            font-size: 12px;
            border-radius: 4px;
        }
        
        .skills-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid #222222;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .skills-grid:last-child { border-bottom: none; margin-bottom: 0; }
        
        .skill-cat {
            color: var(--accent-orange);
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 14px;
            text-transform: uppercase;
        }
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill-tag {
            background-color: #222222;
            color: #ffffff;
            padding: 6px 12px;
            font-weight: 700;
            font-size: 12px;
            border-radius: 4px;
        }
        
        @media (max-width: 768px) {
            .item { grid-template-columns: 1fr; gap: 8px; }
            .item-right { text-align: left; }
            .skills-grid { grid-template-columns: 1fr; gap: 12px; }
            body { padding: 40px 20px; }
            .logo { font-size: 40px; }
            .contact-info { flex-direction: column; align-items: center; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">
            <span class="logo-w1" th:text="${profile.fullName != null ? profile.fullName.split(' ')[0] : 'First'}">First</span><span th:if="${profile.fullName != null and profile.fullName.split(' ').length > 1}" class="logo-w2" th:text="${profile.fullName.substring(profile.fullName.indexOf(' ') + 1)}">Last</span>
        </div>
        <div class="contact-info">
            <span th:if="${profile.location}" th:text="${profile.location}"></span>
            <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}"></a></span>
            <span th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}">in/<span th:text="${profile.linkedin}"></span></span>
            <span th:if="${profile.telegram}">tg/<span th:text="${profile.telegram}"></span></span>
        </div>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
        <th:block th:switch="${sectionName}">
            
            <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}" class="section">
                <h2 class="section-title">Summary</h2>
                <div class="item-desc" th:text="${profile.summary}" style="font-size: 18px; font-weight: 500;"></div>
            </div>

            <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}" class="section">
                <h2 class="section-title">Experience</h2>
                <div class="item-list">
                    <div class="item" th:each="exp : ${profile.experience}">
                        <div class="item-left">
                            <div class="item-title" th:text="${exp.position}">Position</div>
                            <div class="item-subtitle" th:text="${exp.company}">Company</div>
                        </div>
                        <div class="item-right" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</div>
                        <div class="item-desc" th:text="${exp.description}">Description</div>
                        <div class="tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                            <span class="tag" th:text="${exp.techStack}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}" class="section">
                <h2 class="section-title">Education</h2>
                <div class="item-list">
                    <div class="item" th:each="edu : ${profile.education}">
                        <div class="item-left">
                            <div class="item-title" th:text="${edu.institution}">Institution</div>
                            <div class="item-subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                        </div>
                        <div class="item-right" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</div>
                    </div>
                </div>
            </div>

            <div th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}" class="section">
                <h2 class="section-title">Skills</h2>
                <div>
                    <div class="skills-grid" th:each="entry : ${groupedSkills}">
                        <div class="skill-cat" th:text="${entry.key}"></div>
                        <div class="skill-tags">
                            <span class="skill-tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}" class="section">
                <h2 class="section-title">Languages</h2>
                <div style="font-size: 18px; font-weight: 700; color: var(--accent-orange);" th:text="${languagesStr}"></div>
            </div>

            <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}" class="section">
                <h2 class="section-title">Projects</h2>
                <div class="item-list">
                    <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <div class="item-left">
                            <div class="item-title" th:text="${proj.name}">Project Name</div>
                        </div>
                        <div class="item-right">
                            <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank">HUB</a>
                            <span th:if="${proj.githubUrl != null and proj.liveUrl != null}"> / </span>
                            <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank">LIVE</a>
                        </div>
                        <div class="item-desc" th:text="${proj.description}">Description</div>
                        <div class="tags" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                            <span class="tag" th:text="${proj.techStack}"></span>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
