<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Apple Modern Style Resume</title>
    <style>
        @page { size: A4; margin: 20mm; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; font-size: 11px; line-height: 1.5; color: #1D1D1F; background-color: #FFFFFF; }
        .hero { margin-bottom: 30px; text-align: center; }
        h1 { font-size: 32px; font-weight: 700; margin: 0 0 10px 0; letter-spacing: -0.5px; }
        .contact { font-size: 11px; color: #86868B; }
        .contact span { margin: 0 10px; display: inline-block; }
        a { color: #0071E3; text-decoration: none; }
        h2 { font-size: 14px; color: #86868B; margin-top: 30px; margin-bottom: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .section-wrapper { border-bottom: 1px solid #E5E5EA; padding-bottom: 25px; }
        .section-wrapper:last-child { border-bottom: none; }
        
        .layout { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .layout td { vertical-align: top; padding: 0; }
        .left { width: 25%; font-weight: 600; font-size: 11px; color: #86868B; }
        .right { width: 75%; }
        
        .item-title { font-size: 14px; font-weight: 600; color: #1D1D1F; margin-bottom: 4px; }
        .item-subtitle { font-size: 11px; color: #86868B; margin-bottom: 8px; }
        .item-desc { font-size: 11px; color: #1D1D1F; margin-bottom: 15px; }
        .tech-tag { display: inline-block; background-color: #F5F5F7; border-radius: 8px; padding: 4px 10px; margin-right: 6px; margin-bottom: 6px; font-size: 10px; color: #1D1D1F; }
        
        .skills-table { width: 100%; border-collapse: collapse; }
        .skills-table td { padding: 8px 0; vertical-align: top; }
        .cat-col { width: 25%; color: #86868B; font-weight: 600; font-size: 11px; }
        .det-col { width: 75%; }
    </style>
</head>
<body>
    <div class="hero">
        <h1 th:text="${profile.fullName}">Name</h1>
        <div class="contact">
            <span th:if="${profile.location}" th:text="${profile.location}"></span>
            <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}"></a></span>
            <span th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}">in/<span th:text="${profile.linkedin}"></span></span>
            <span th:if="${profile.telegram}">tg/<span th:text="${profile.telegram}"></span></span>
        </div>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
        <div th:switch="${sectionName}" class="section-wrapper">
            
            <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                <h2>Profile</h2>
                <div class="item-desc" th:text="${profile.summary}" style="font-size: 12px; line-height: 1.6;"></div>
            </div>

            <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                <h2>Experience</h2>
                <table class="layout" th:each="exp : ${profile.experience}">
                    <tr>
                        <td class="left" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</td>
                        <td class="right">
                            <div class="item-title" th:text="${exp.position}">Position</div>
                            <div class="item-subtitle" th:text="${exp.company}">Company</div>
                            <div class="item-desc" th:text="${exp.description}">Description</div>
                            <div th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                                <span class="tech-tag" th:text="${exp.techStack}"></span>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>

            <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                <h2>Education</h2>
                <table class="layout" th:each="edu : ${profile.education}">
                    <tr>
                        <td class="left" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</td>
                        <td class="right">
                            <div class="item-title" th:text="${edu.institution}">Institution</div>
                            <div class="item-subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                        </td>
                    </tr>
                </table>
            </div>

            <div th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                <h2>Skills</h2>
                <table class="skills-table">
                    <tr th:each="entry : ${groupedSkills}">
                        <td class="cat-col" th:text="${entry.key}"></td>
                        <td class="det-col">
                            <span class="tech-tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                        </td>
                    </tr>
                </table>
            </div>

            <div th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                <h2>Languages</h2>
                <table class="skills-table">
                    <tr>
                        <td class="cat-col">Languages</td>
                        <td class="det-col" style="color: #1D1D1F;" th:text="${languagesStr}"></td>
                    </tr>
                </table>
            </div>

            <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                <h2>Projects</h2>
                <table class="layout" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                    <tr>
                        <td class="left">
                            <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}">GitHub</a>
                            <br th:if="${proj.githubUrl != null and proj.liveUrl != null}"/>
                            <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}">Live</a>
                        </td>
                        <td class="right">
                            <div class="item-title" th:text="${proj.name}">Project Name</div>
                            <div class="item-desc" th:text="${proj.description}">Description</div>
                            <div th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                <span class="tech-tag" th:text="${proj.techStack}"></span>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
