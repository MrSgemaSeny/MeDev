<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Apple Modern Style Resume</title>
    <style>
        @page { size: A4; margin: 20mm; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #FFFFFF; color: #1D1D1F; margin: 0; font-size: 11px; line-height: 1.5; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 38px; font-weight: 600; letter-spacing: -1px; margin: 0 0 10px 0; color: #1D1D1F; }
        .contact { font-size: 11px; color: #86868B; margin-bottom: 20px; }
        .contact span { margin: 0 8px; }
        a { color: #0071E3; text-decoration: none; }
        h2 { font-size: 14px; font-weight: 600; color: #1D1D1F; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #E5E5EA; padding-bottom: 4px; margin-top: 30px; margin-bottom: 15px; }
        .layout { width: 100%; border-collapse: collapse; margin-bottom: 2px; }
        .layout td { vertical-align: top; padding: 0; }
        .left { text-align: left; font-weight: 600; font-size: 13px; color: #1D1D1F; }
        .right { text-align: right; font-size: 11px; color: #86868B; }
        .item { margin-bottom: 20px; }
        .item-subheader { color: #1D1D1F; font-size: 12px; margin-bottom: 5px; font-weight: 500; }
        .item-desc { font-size: 11px; color: #424245; }
        .tech-stack { color: #0071E3; font-size: 10px; margin-top: 4px; }
        .skills-table { width: 100%; border-collapse: collapse; }
        .skills-table td { padding: 8px 0; vertical-align: top; border-bottom: 1px solid #F5F5F7; }
        .cat-col { width: 25%; font-weight: 600; color: #1D1D1F; font-size: 11px; }
        .det-col { width: 75%; color: #424245; font-size: 11px; }
        .footer { margin-top: 40px; font-size: 10px; color: #86868B; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${profile.fullName}">Name</h1>
        <div class="contact">
            <span th:if="${profile.location}" th:text="${profile.location}"></span>
            <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}"></a></span>
            <span th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}"><span th:text="${profile.linkedin}"></span></span>
            <span th:if="${profile.telegram}"><span th:text="${profile.telegram}"></span></span>
        </div>
        <div class="item-desc" th:if="${profile.summary != null}" th:text="${profile.summary}" style="max-width: 80%; margin: 0 auto; text-align: center;"></div>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'experience','education','skills','languages','projects'}}">
        <div th:switch="${sectionName}">
            
            <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                <h2>Experience</h2>
                <div class="item" th:each="exp : ${profile.experience}">
                    <table class="layout">
                        <tr>
                            <td class="left" th:text="${exp.position}">Position</td>
                            <td class="right" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</td>
                        </tr>
                    </table>
                    <div class="item-subheader" th:text="${exp.company}">Company</div>
                    <div class="item-desc" th:text="${exp.description}">Description</div>
                    <div class="tech-stack" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}" th:text="${exp.techStack}"></div>
                </div>
            </div>

            <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                <h2>Education</h2>
                <div class="item" th:each="edu : ${profile.education}">
                    <table class="layout">
                        <tr>
                            <td class="left" th:text="${edu.institution}">Institution</td>
                            <td class="right" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</td>
                        </tr>
                    </table>
                    <div class="item-subheader" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                </div>
            </div>

            <div th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                <h2>Skills</h2>
                <table class="skills-table">
                    <tr th:each="entry : ${groupedSkills}">
                        <td class="cat-col" th:text="${entry.key}"></td>
                        <td class="det-col">
                            <span th:each="skillName, iterStat : ${entry.value}" th:text="${skillName + (!iterStat.last ? ', ' : '')}"></span>
                        </td>
                    </tr>
                </table>
            </div>

            <div th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                <h2>Languages</h2>
                <table class="skills-table">
                    <tr>
                        <td class="cat-col">Languages</td>
                        <td class="det-col" th:text="${languagesStr}"></td>
                    </tr>
                </table>
            </div>

            <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                <h2>Projects</h2>
                <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                    <table class="layout">
                        <tr>
                            <td class="left" th:text="${proj.name}">Project Name</td>
                            <td class="right">
                                <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}">GitHub</a>
                                <span th:if="${proj.githubUrl != null and proj.liveUrl != null}"> &bull; </span>
                                <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}">Live</a>
                            </td>
                        </tr>
                    </table>
                    <div class="item-desc" th:text="${proj.description}">Description</div>
                    <div class="tech-stack" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}" th:text="${proj.techStack}"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        Generated by MeDev Platform &bull; Apple Modern Style
    </div>
</body>
</html>
