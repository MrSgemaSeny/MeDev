<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - Apple Resume'">Apple Modern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-blue: #0066cc;
            --border-light: #d2d2d7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 50px 40px;
        }
        
        .container {
            max-width: 980px;
            margin: 0 auto;
        }
        
        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 60px;
        }
        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }
        .hero-meta {
            font-size: 15px;
            color: var(--text-secondary);
        }
        .hero-meta span { margin: 0 8px; }
        .hero-meta a { color: var(--accent-blue); text-decoration: none; }
        
        /* Sections */
        .spec-section {
            width: 100%;
            display: table;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-light);
        }
        .spec-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .section-label {
            display: table-cell;
            width: 200px;
            vertical-align: top;
            font-size: 18px;
            font-weight: 600;
            padding-right: 20px;
        }
        .section-content {
            display: table-cell;
            vertical-align: top;
        }
        
        /* Summary */
        .summary-text { font-size: 18px; line-height: 1.6; color: var(--text-secondary); }
        
        /* Items */
        .item { margin-bottom: 24px; }
        .item:last-child { margin-bottom: 0; }
        
        .item-header { width: 100%; display: table; margin-bottom: 4px; }
        .item-title { display: table-cell; font-size: 18px; font-weight: 600; text-align: left; }
        .item-date { display: table-cell; font-size: 14px; color: var(--text-secondary); text-align: right; }
        
        .item-subtitle { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--text-primary); }
        .item-desc { font-size: 15px; color: var(--text-secondary); margin-bottom: 12px; }
        
        /* Tags / Skills */
        .spec-tags { margin-top: 8px; }
        .spec-tag {
            display: inline-block;
            background: #f5f5f7;
            color: var(--text-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        /* Two col for skills */
        .two-col { width: 100%; }
        .col-half { display: inline-block; width: 48%; vertical-align: top; margin-bottom: 20px; }
        .skill-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="hero">
            <div th:if="${profile.githubUsername != null}" style="width: 96px; height: 96px; border-radius: 50%; overflow: hidden; margin: 0 auto 20px auto;">
                <img th:src="@{'https://github.com/' + ${profile.githubUsername} + '.png'}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>
            <h1 th:text="${profile.fullName}">Name</h1>
            <div class="hero-meta">
                <span th:if="${profile.location}" th:text="${profile.location}"></span>
                <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></span>
                <span th:if="${profile.githubUsername}">GH: <a th:href="'https://github.com/' + ${profile.githubUsername}" th:text="${profile.githubUsername}" style="color:var(--text-secondary);"></a></span>
                <span th:if="${profile.linkedin}">IN: <span th:text="${profile.linkedin}"></span></span>
            </div>
        </div>

        <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
            <th:block th:switch="${sectionName}">
                
                <div class="spec-section" th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                    <div class="section-label">Overview</div>
                    <div class="section-content">
                        <div class="summary-text" th:text="${profile.summary}"></div>
                    </div>
                </div>

                <div class="spec-section" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <div class="section-label">Experience</div>
                    <div class="section-content">
                        <div class="item" th:each="exp : ${profile.experience}">
                            <div class="item-header">
                                <div class="item-title" th:text="${exp.position}"></div>
                                <div class="item-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                            </div>
                            <div class="item-subtitle" th:text="${exp.company}"></div>
                            <div class="item-desc" th:text="${exp.description}"></div>
                            <div class="spec-tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                                <span class="spec-tag" th:text="${exp.techStack}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="spec-section" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <div class="section-label">Education</div>
                    <div class="section-content">
                        <div class="item" th:each="edu : ${profile.education}">
                            <div class="item-header">
                                <div class="item-title" th:text="${edu.institution}"></div>
                                <div class="item-date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                            </div>
                            <div class="item-subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')"></div>
                        </div>
                    </div>
                </div>

                <div class="spec-section" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <div class="section-label">Core Skills</div>
                    <div class="section-content two-col">
                        <div class="col-half" th:each="entry : ${groupedSkills}">
                            <div class="skill-title" th:text="${entry.key}"></div>
                            <div class="spec-tags" style="margin-top:0;">
                                <span class="spec-tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="spec-section" th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                    <div class="section-label">Languages</div>
                    <div class="section-content">
                        <div class="summary-text" th:text="${languagesStr}"></div>
                    </div>
                </div>

                <div class="spec-section" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <div class="section-label">Projects</div>
                    <div class="section-content">
                        <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                            <div class="item-header">
                                <div class="item-title" th:text="${proj.name}"></div>
                                <div class="item-date">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank" style="color:var(--accent-blue); text-decoration:none;">GitHub</a>
                                    <span th:if="${proj.githubUrl and proj.liveUrl}"> &middot; </span>
                                    <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank" style="color:var(--accent-blue); text-decoration:none;">Live Demo</a>
                                </div>
                            </div>
                            <div class="item-desc" th:text="${proj.description}"></div>
                            <div class="spec-tags" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                <span class="spec-tag" th:text="${proj.techStack}"></span>
                            </div>
                        </div>
                    </div>
                </div>

            </th:block>
        </th:block>

    </div>
</body>
</html>
