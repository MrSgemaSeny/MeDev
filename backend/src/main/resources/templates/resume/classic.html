<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resume</title>
    <style>
        body { font-family: 'Times New Roman', Times, serif; margin: 30px 40px; color: #111; line-height: 1.4; }
        h1 { font-size: 36px; margin-bottom: 2px; color: #000; text-align: center; font-weight: normal; }
        h2 { font-size: 14px; border-bottom: 1px solid #000; padding-bottom: 2px; margin-top: 15px; margin-bottom: 8px; text-transform: uppercase; color: #000; font-weight: bold; }
        .contact-info { text-align: center; font-size: 12px; margin-bottom: 20px; }
        .contact-info span { margin: 0 4px; }
        a { color: #000; text-decoration: none; }
        
        table.layout { width: 100%; border-collapse: collapse; margin-bottom: 2px; }
        table.layout td { vertical-align: top; padding: 0; }
        td.left { text-align: left; font-weight: bold; font-size: 13px; }
        td.right { text-align: right; font-style: italic; font-size: 12px; }
        
        .item { margin-bottom: 10px; }
        .item-subheader { font-style: italic; font-size: 13px; margin-bottom: 3px; }
        .item-desc { font-size: 12px; margin-top: 3px; }
        .tech-stack { font-size: 11px; font-style: italic; margin-top: 3px; color: #333; }
        
        table.skills { width: 100%; border-collapse: collapse; font-size: 12px; }
        table.skills td { padding: 2px 0; vertical-align: top; }
        table.skills td.category { font-weight: bold; width: 25%; }
        table.skills td.details { width: 75%; }
        
        .footer { margin-top: 40px; font-size: 10px; text-align: center; font-style: italic; color: #666; }
    </style>
</head>
<body>

    <h1 th:text="${profile.fullName}">Name</h1>
    <div class="contact-info">
        <span th:if="${profile.location}" th:text="${profile.location}"></span>
        <span th:if="${profile.website}"> &bull; <a th:href="${profile.website}" th:text="${profile.website}"></a></span>
        <span th:if="${profile.githubUsername}"> &bull; github.com/<span th:text="${profile.githubUsername}"></span></span>
        <span th:if="${profile.linkedin}"> &bull; <span th:text="${profile.linkedin}"></span></span>
        <span th:if="${profile.telegram}"> &bull; <span th:text="${profile.telegram}"></span></span>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
        
        <div th:switch="${sectionName}">
            
            <!-- SUMMARY -->
            <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                <h2>Summary</h2>
                <div class="item-desc" th:text="${profile.summary}"></div>
            </div>

            <!-- EXPERIENCE -->
            <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                <h2>Experience</h2>
                <div>
                    <div class="item" th:each="exp : ${profile.experience}">
                        <table class="layout">
                            <tr>
                                <td class="left" th:text="${exp.position}">Position</td>
                                <td class="right" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</td>
                            </tr>
                        </table>
                        <div class="item-subheader" th:text="${exp.company}">Company</div>
                        <div class="item-desc" th:text="${exp.description}">Description</div>
                        <div class="tech-stack" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}" th:text="'Technologies: ' + ${exp.techStack}"></div>
                    </div>
                </div>
            </div>

            <!-- EDUCATION -->
            <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                <h2>Education</h2>
                <div>
                    <div class="item" th:each="edu : ${profile.education}">
                        <table class="layout">
                            <tr>
                                <td class="left" th:text="${edu.institution}">Institution</td>
                                <td class="right" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</td>
                            </tr>
                        </table>
                        <div class="item-subheader" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                    </div>
                </div>
            </div>

            <!-- SKILLS -->
            <div th:case="'skills'" th:if="${profile.skills != null and !profile.skills.isEmpty()}">
                <h2>Skills</h2>
                <table class="skills">
                    <tr th:each="skill : ${profile.skills}">
                        <td class="category" th:text="${skill.category != null ? skill.category : 'General'}"></td>
                        <td class="details" th:text="${skill.name} + (${skill.level != null ? ' (' + skill.level + ')' : ''})"></td>
                    </tr>
                </table>
            </div>

            <!-- LANGUAGES -->
            <div th:case="'languages'" th:if="${profile.languages != null and !profile.languages.isEmpty()}">
                <h2>Languages</h2>
                <table class="skills">
                    <tr th:each="lang : ${profile.languages}">
                        <td class="category" th:text="${lang.name}"></td>
                        <td class="details" th:text="${lang.level != null ? lang.level : ''}"></td>
                    </tr>
                </table>
            </div>

            <!-- PROJECTS -->
            <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                <h2>Projects</h2>
                <div>
                    <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <table class="layout">
                            <tr>
                                <td class="left" th:text="${proj.name}">Project Name</td>
                                <td class="right">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}">GitHub</a>
                                    <span th:if="${proj.githubUrl != null and !proj.githubUrl.isEmpty() and proj.liveUrl != null and !proj.liveUrl.isEmpty()}"> | </span>
                                    <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}">Live</a>
                                </td>
                            </tr>
                        </table>
                        <div class="item-desc" th:text="${proj.description}">Description</div>
                        <div class="tech-stack" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}" th:text="'Technologies: ' + ${proj.techStack}"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="footer">
        Generated by MeDev Platform on <span th:text="${generatedAt}"></span>
    </div>

</body>
</html>
