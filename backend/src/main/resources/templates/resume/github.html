<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>GitHub Style Resume</title>
    <style>
        @page { size: A4; margin: 15mm; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 0; font-size: 11px; line-height: 1.5; }
        .master-table { width: 100%; border-collapse: collapse; }
        .col-left { width: 28%; vertical-align: top; padding-right: 15px; }
        .col-right { width: 72%; vertical-align: top; padding-left: 15px; }
        
        h1 { color: #c9d1d9; font-size: 24px; margin: 0 0 5px 0; font-weight: 600; line-height: 1.25; }
        .login { font-size: 16px; color: #8b949e; font-weight: 300; margin-bottom: 15px; }
        .contact { font-size: 11px; color: #c9d1d9; margin-bottom: 15px; line-height: 1.8; }
        a { color: #58a6ff; text-decoration: none; }
        h2 { font-size: 14px; color: #c9d1d9; border-bottom: 1px solid #30363d; padding-bottom: 6px; margin-top: 20px; margin-bottom: 15px; font-weight: 600; }
        h2.left-title { border-bottom: none; font-size: 14px; margin-top: 20px; margin-bottom: 10px; }
        
        .item-box { border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; background-color: #0d1117; }
        .item-title { font-size: 12px; font-weight: 600; color: #58a6ff; }
        .item-subtitle { font-size: 11px; color: #8b949e; margin-bottom: 8px; margin-top: 4px; }
        .item-desc { font-size: 11px; color: #8b949e; margin-bottom: 10px; }
        .tech-tag { display: inline-block; background-color: rgba(56,139,253,0.1); color: #58a6ff; border-radius: 2em; padding: 2px 8px; margin-right: 4px; margin-bottom: 4px; font-size: 9px; font-weight: 500; }
        
        .layout { width: 100%; border-collapse: collapse; }
        .layout td { padding: 0; }
    </style>
</head>
<body>
    <table class="master-table">
        <tr>
            <!-- LEFT COLUMN -->
            <td class="col-left">
                <div style="width: 100px; height: 100px; border-radius: 50%; border: 1px solid #30363d; margin-bottom: 15px; background-color: #161b22; display: inline-block;"></div>
                
                <h1 th:text="${profile.fullName}">Name</h1>
                <div class="login" th:text="${profile.githubUsername != null ? profile.githubUsername : profile.fullName.toLowerCase().replace(' ', '')}">username</div>
                
                <div class="contact">
                    <div th:if="${profile.location}">📍 <span th:text="${profile.location}"></span></div>
                    <div th:if="${profile.website}">🔗 <a th:href="${profile.website}" th:text="${profile.website}"></a></div>
                    <div th:if="${profile.linkedin}">💼 <span th:text="${profile.linkedin}"></span></div>
                    <div th:if="${profile.telegram}">✈️ <span th:text="${profile.telegram}"></span></div>
                </div>

                <div th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <h2 class="left-title">Skills</h2>
                    <div th:each="entry : ${groupedSkills}" style="margin-bottom: 10px;">
                        <div style="color:#8b949e; font-size:10px; margin-bottom:4px;" th:text="${entry.key}"></div>
                        <span class="tech-tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                    </div>
                </div>

                <div th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                    <h2 class="left-title">Languages</h2>
                    <div style="color: #c9d1d9; font-size: 11px;" th:text="${languagesStr}"></div>
                </div>
            </td>
            
            <!-- RIGHT COLUMN -->
            <td class="col-right">
                <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','projects','experience','education'}}">
                    <div th:switch="${sectionName}">
                        
                        <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                            <div class="item-box">
                                <div style="font-size: 12px; color: #c9d1d9;" th:text="${profile.summary}"></div>
                            </div>
                        </div>

                        <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                            <h2>Pinned</h2>
                            <div class="item-box" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                                <div class="item-title">
                                    <span style="color: #8b949e; margin-right: 6px;">📁</span>
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" th:text="${proj.name}"></a>
                                    <span th:unless="${proj.githubUrl}" th:text="${proj.name}"></span>
                                </div>
                                <div class="item-desc" style="margin-top: 8px;" th:text="${proj.description}"></div>
                                <div th:if="${proj.techStack != null and !proj.techStack.isEmpty()}" style="margin-top: 8px;">
                                    <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background-color:#238636; margin-right:4px;"></span>
                                    <span style="font-size: 10px; color: #8b949e;" th:text="${proj.techStack}"></span>
                                </div>
                            </div>
                        </div>

                        <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                            <h2>Experience History</h2>
                            <div class="item-box" th:each="exp : ${profile.experience}" style="border-color: transparent; border-left: 2px solid #30363d; border-radius: 0; padding-left: 15px; margin-bottom: 20px;">
                                <table class="layout">
                                    <tr>
                                        <td class="item-title" th:text="${exp.position}">Position</td>
                                        <td style="text-align: right; color: #8b949e; font-size: 10px;" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</td>
                                    </tr>
                                </table>
                                <div class="item-subtitle" th:text="${exp.company}">Company</div>
                                <div class="item-desc" th:text="${exp.description}">Description</div>
                                <div th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                                    <span class="tech-tag" style="background-color: transparent; border: 1px solid #30363d;" th:text="${exp.techStack}"></span>
                                </div>
                            </div>
                        </div>

                        <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                            <h2>Education History</h2>
                            <div class="item-box" th:each="edu : ${profile.education}" style="border-color: transparent; border-left: 2px solid #30363d; border-radius: 0; padding-left: 15px; margin-bottom: 20px;">
                                <table class="layout">
                                    <tr>
                                        <td class="item-title" th:text="${edu.institution}">Institution</td>
                                        <td style="text-align: right; color: #8b949e; font-size: 10px;" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</td>
                                    </tr>
                                </table>
                                <div class="item-subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
