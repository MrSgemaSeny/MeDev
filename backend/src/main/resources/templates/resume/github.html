<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - GitHub Resume'">GitHub Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #0d1117;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-green: #238636;
            --accent-blue: #58a6ff;
            --tag-bg: rgba(56, 139, 253, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 40px;
        }
        .container {
            max-width: 1216px;
            margin: 0 auto;
            display: table;
            width: 100%;
        }
        
        /* Left Sidebar */
        .sidebar {
            display: table-cell;
            width: 320px;
            padding-right: 32px;
            vertical-align: top;
        }
        .avatar {
            width: 288px;
            height: 288px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: #161b22;
            overflow: hidden;
            margin-bottom: 16px;
            text-align: center;
            line-height: 288px;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            vertical-align: middle;
        }
        .names { margin-bottom: 16px; }
        .fullname {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--text-primary);
        }
        .username {
            font-size: 20px;
            color: var(--text-secondary);
            font-weight: 300;
            line-height: 24px;
        }
        .bio {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }
        .btn-follow {
            width: 100%;
            background-color: #21262d;
            border: 1px solid rgba(240, 246, 252, 0.1);
            color: var(--text-primary);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 16px;
        }
        .contact-list {
            font-size: 14px;
            margin-bottom: 24px;
        }
        .contact-item { margin-bottom: 6px; }
        .contact-item a { color: var(--text-primary); text-decoration: none; }
        .contact-item a:hover { color: var(--accent-blue); text-decoration: underline; }
        
        .sidebar-section {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            margin-top: 16px;
        }
        h3.side-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        
        /* Tags in sidebar */
        .skills-group { margin-bottom: 12px; }
        .skills-group-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .tag {
            display: inline-block;
            background-color: var(--tag-bg);
            color: var(--accent-blue);
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 20px;
            margin-right: 6px;
            margin-bottom: 6px;
        }
        
        /* Main Content */
        .main-content {
            display: table-cell;
            vertical-align: top;
            padding-left: 32px;
        }
        .section-header {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        
        /* Pinned Projects */
        .projects-wrapper { width: 100%; margin-bottom: 32px; }
        .pinned-card {
            display: inline-block;
            width: 48%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            background-color: var(--bg-color);
            vertical-align: top;
            margin-bottom: 16px;
            margin-right: 1%;
            box-sizing: border-box;
        }
        .repo-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }
        .repo-title a { color: inherit; text-decoration: none; }
        .repo-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            min-height: 36px;
        }
        .repo-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .lang-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-green);
            margin-right: 4px;
            vertical-align: middle;
        }
        
        /* Timeline items */
        .timeline-container { margin-bottom: 32px; }
        .timeline-item {
            position: relative;
            padding-left: 24px;
            margin-bottom: 24px;
            border-left: 2px solid var(--border-color);
        }
        .timeline-icon {
            position: absolute;
            top: 0;
            left: -8px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #388bfd;
            border: 2px solid var(--bg-color);
        }
        
        .timeline-content {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            padding: 16px;
            margin-top: -6px; /* align with icon */
        }
        .timeline-header {
            width: 100%;
            display: table;
            margin-bottom: 4px;
        }
        .timeline-title {
            display: table-cell;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .timeline-date {
            display: table-cell;
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .timeline-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .timeline-desc {
            font-size: 14px;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="avatar" th:if="${profile.githubUsername != null}">
                <img th:src="@{'https://github.com/' + ${profile.githubUsername} + '.png'}" alt="Avatar" />
            </div>
            <div class="avatar" th:unless="${profile.githubUsername != null}">
                <span th:text="${profile.fullName != null and profile.fullName.length() gt 0 ? profile.fullName.substring(0,1).toUpperCase() : 'U'}" style="font-size: 120px; color: var(--text-primary);"></span>
            </div>
            
            <div class="names">
                <h1 class="fullname" th:text="${profile.fullName}">Name</h1>
                <div class="username" th:text="${profile.githubUsername != null ? profile.githubUsername : profile.fullName.toLowerCase().replace(' ', '')}">username</div>
            </div>
            
            <div class="btn-follow">Contact</div>
            
            <div class="contact-list">
                <div class="contact-item" th:if="${profile.location}"><span style="color: var(--text-secondary); margin-right: 4px;">Loc:</span> <span th:text="${profile.location}"></span></div>
                <div class="contact-item" th:if="${profile.website}"><span style="color: var(--text-secondary); margin-right: 4px;">Web:</span> <a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></div>
                <div class="contact-item" th:if="${profile.linkedin}"><span style="color: var(--text-secondary); margin-right: 4px;">In:</span> <span th:text="${profile.linkedin}"></span></div>
                <div class="contact-item" th:if="${profile.telegram}"><span style="color: var(--text-secondary); margin-right: 4px;">Tg:</span> <span th:text="${profile.telegram}"></span></div>
            </div>
            
            <div class="sidebar-section" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                <h3 class="side-title">Skills</h3>
                <div class="skills-group" th:each="entry : ${groupedSkills}">
                    <div class="skills-group-title" th:text="${entry.key}"></div>
                    <div style="margin-top:4px;">
                        <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-section" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                <h3 class="side-title">Languages</h3>
                <div style="font-size: 14px; color: var(--text-primary);" th:text="${languagesStr}"></div>
            </div>
        </div>
        
        <!-- MAIN CONTENT -->
        <div class="main-content">
            
            <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','projects','experience','education'}}">
                <th:block th:switch="${sectionName}">
                    
                    <!-- SUMMARY -->
                    <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                        <div class="timeline-content" style="margin-bottom:32px;">
                            <div th:text="${profile.summary}"></div>
                        </div>
                    </div>

                    <!-- PROJECTS -->
                    <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                        <h2 class="section-header">Pinned Projects</h2>
                        <div class="projects-wrapper">
                            <div class="pinned-card" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                                <div class="repo-title">
                                    <svg aria-hidden="true" height="16" viewBox="0 0 16 16" version="1.1" width="16" fill="var(--text-secondary)" style="vertical-align: middle; margin-right: 4px;"><path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path></svg>
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" th:text="${proj.name}" target="_blank"></a>
                                    <span th:unless="${proj.githubUrl}" th:text="${proj.name}"></span>
                                </div>
                                <div class="repo-desc" th:text="${proj.description}"></div>
                                <div class="repo-meta" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                    <span class="lang-dot"></span>
                                    <span th:text="${proj.techStack}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- EXPERIENCE -->
                    <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                        <h2 class="section-header">Experience</h2>
                        <div class="timeline-container">
                            <div class="timeline-item" th:each="exp : ${profile.experience}">
                                <div class="timeline-icon"></div>
                                <div class="timeline-content">
                                    <div class="timeline-header">
                                        <div class="timeline-title" th:text="${exp.position}"></div>
                                        <div class="timeline-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                                    </div>
                                    <div class="timeline-subtitle" th:text="${exp.company}"></div>
                                    <div class="timeline-desc" th:text="${exp.description}"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- EDUCATION -->
                    <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                        <h2 class="section-header">Education</h2>
                        <div class="timeline-container">
                            <div class="timeline-item" th:each="edu : ${profile.education}">
                                <div class="timeline-icon" style="background-color: var(--text-secondary);"></div>
                                <div class="timeline-content">
                                    <div class="timeline-header">
                                        <div class="timeline-title" th:text="${edu.institution}"></div>
                                        <div class="timeline-date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                                    </div>
                                    <div class="timeline-subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </th:block>
            </th:block>
            
        </div>
    </div>
</body>
</html>
