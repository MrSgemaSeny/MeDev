<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - GitHub Resume'">GitHub Resume</title>

    <style>
        :root {
            --bg-color: #0d1117;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-green: #238636;
            --accent-blue: #58a6ff;
            --tag-bg: rgba(56, 139, 253, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.5;
            padding: 40px;
            font-size: 13px;
        }
        @page {
            size: A4;
            margin: 20px 25px;
            background-color: #0d1117;
        }
        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.4;
            padding: 0;
            font-size: 11px;
        }
        .container {
            max-width: 1216px;
            margin: 0 auto;
            display: table;
            width: 100%;
        }
        
        /* Left Sidebar */
        .sidebar {
            display: table-cell;
            width: 190px;
            padding-right: 16px;
            vertical-align: top;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid #30363d;
            background-color: #161b22;
            overflow: hidden;
            margin: 0 auto 10px auto;
            text-align: center;
            line-height: 70px;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            vertical-align: middle;
        }
        .names { margin-bottom: 10px; }
        .fullname {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.2;
            color: #c9d1d9;
        }
        .username {
            font-size: 13px;
            color: #8b949e;
            font-weight: 300;
            line-height: 18px;
        }
        .bio {
            font-family: Roboto, sans-serif;
            font-size: 11px;
            color: #c9d1d9;
            margin-bottom: 10px;
        }
        .contact-list {
            font-size: 11px;
            margin-bottom: 14px;
        }
        .contact-item { margin-bottom: 4px; }
        .contact-item a { color: #c9d1d9; text-decoration: none; }
        .contact-item a:hover { color: #58a6ff; text-decoration: underline; }
        
        .sidebar-section {
            border-top: 1px solid #30363d;
            padding-top: 10px;
            margin-top: 10px;
            page-break-inside: avoid;
        }
        h3.side-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #c9d1d9;
        }
        
        /* Tags in sidebar */
        .skills-group { margin-bottom: 8px; }
        .skills-group-title {
            font-size: 10px;
            color: #8b949e;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .tag {
            display: inline-block;
            background-color: rgba(56, 139, 253, 0.1);
            color: #58a6ff;
            padding: 1px 6px;
            font-size: 9px;
            font-weight: 500;
            border-radius: 12px;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        
        /* Main Content */
        .main-content {
            display: table-cell;
            vertical-align: top;
            padding-left: 16px;
        }
        .section-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 4px;
            page-break-after: avoid;
        }
        
        /* Pinned Projects */
        .projects-wrapper { width: 100%; margin-bottom: 14px; }
        .pinned-card {
            display: block;
            width: 100%;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 8px 10px;
            background-color: #0d1117;
            margin-bottom: 8px;
            page-break-inside: avoid;
        }
        .repo-title {
            font-size: 12px;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 4px;
        }
        .repo-title a { color: inherit; text-decoration: none; }
        .repo-desc {
            display: block;
            font-size: 10.5px;
            color: #8b949e;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .repo-meta {
            font-size: 9.5px;
            color: #8b949e;
        }
        .lang-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #238636;
            margin-right: 3px;
            vertical-align: middle;
        }
        
        /* Timeline items */
        .timeline-container { margin-bottom: 14px; width: 100%; border-collapse: collapse; page-break-inside: avoid; }
        .timeline-icon-td { width: 14px; vertical-align: top; text-align: right; }
        .timeline-content-td { border-left: 1px solid #30363d; padding-left: 12px; padding-bottom: 10px; vertical-align: top; }
        
        .timeline-icon {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #388bfd;
            border: 1.5px solid #0d1117;
            margin-top: 4px;
            margin-right: -4.5px;
        }
        
        .timeline-content {
            padding: 0 0 4px 0;
        }
        .timeline-header {
            width: 100%;
            display: table;
            margin-bottom: 2px;
        }
        .timeline-title {
            display: table-cell;
            font-size: 12px;
            font-weight: 600;
            color: #c9d1d9;
        }
        .timeline-date {
            display: table-cell;
            text-align: right;
            font-size: 10px;
            color: #8b949e;
        }
        .timeline-subtitle {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 3px;
        }
        .timeline-desc {
            font-size: 10.5px;
            color: #c9d1d9;
            line-height: 1.35;
        }
        
        /* Single Page Overrides */
        body.single-page { padding: 0; }
        .single-page .timeline-container { margin-bottom: 10px; }
        .single-page .pinned-card { padding: 6px 8px; margin-bottom: 6px; }
        .single-page .projects-wrapper { margin-bottom: 10px; }
    </style>
</head>
<body th:classappend="${singlePage != null and singlePage} ? 'single-page' : 'multi-page'">
    <div class="container">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="avatar" th:if="${profile.githubUsername != null}">
                <img th:src="${avatarBase64 ?: 'https://github.com/' + profile.githubUsername + '.png'}" alt="Avatar" />
            </div>
            <div class="avatar" th:unless="${profile.githubUsername != null}">
                <span th:text="${profile.fullName != null and profile.fullName.length() gt 0 ? profile.fullName.substring(0,1).toUpperCase() : 'U'}" style="font-size: 60px; color: #c9d1d9;"></span>
            </div>
            
            <div class="names">
                <h1 class="fullname" th:text="${profile.fullName}">Name</h1>
                <div class="username" th:text="${profile.githubUsername != null ? profile.githubUsername : profile.fullName.toLowerCase().replace(' ', '')}">username</div>
            </div>
            
            <div class="contact-list">
                <div class="contact-item" th:if="${profile.location != null and !profile.location.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">Loc:</span> <span th:text="${profile.location}"></span></div>
                <div class="contact-item" th:if="${profile.website != null and !profile.website.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">Web:</span> <a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></div>
                <div class="contact-item" th:if="${profile.linkedin != null and !profile.linkedin.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">In:</span> <span th:text="${profile.linkedin}"></span></div>
                <div class="contact-item" th:if="${profile.telegram != null and !profile.telegram.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">Tg:</span> <span th:text="${profile.telegram}"></span></div>
            </div>
            
            <div class="sidebar-section" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                <h3 class="side-title">Skills</h3>
                <div class="skills-group" th:each="entry : ${groupedSkills}">
                    <div class="skills-group-title" th:text="${entry.key}"></div>
                    <div style="margin-top:4px;">
                        <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-section" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                <h3 class="side-title">Languages</h3>
                <div style="font-size: 14px; color: #c9d1d9;" th:text="${languagesStr}"></div>
            </div>
        </div>
        
        <!-- MAIN CONTENT -->
        <div class="main-content">
            
            <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','projects','experience','education'}}">
                <th:block th:switch="${sectionName}">
                    
                    <!-- SUMMARY -->
                    <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                        <div class="timeline-content" style="margin-bottom:32px;">
                            <div th:text="${profile.summary}"></div>
                        </div>
                    </div>

                    <!-- PROJECTS -->
                    <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                        <h2 class="section-header">Pinned Projects</h2>
                        <div class="projects-wrapper">
                            <div class="pinned-card" th:each="proj, stat : ${profile.projects}" th:if="${proj.isVisible and stat.index < 3}">
                                <div class="repo-title">
                                    <svg aria-hidden="true" height="16" viewBox="0 0 16 16" version="1.1" width="16" fill="#8b949e" style="vertical-align: middle; margin-right: 4px;"><path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path></svg>
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" th:text="${proj.name}" target="_blank"></a>
                                    <span th:unless="${proj.githubUrl}" th:text="${proj.name}"></span>
                                </div>
                                <div class="repo-desc" th:text="${proj.description}"></div>
                                <div class="repo-meta" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                    <span class="lang-dot"></span>
                                    <span th:text="${proj.techStack}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- EXPERIENCE -->
                    <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                        <h2 class="section-header">Experience</h2>
                        <table class="timeline-container">
                            <tr th:each="exp : ${profile.experience}">
                                <td class="timeline-icon-td">
                                    <div class="timeline-icon"></div>
                                </td>
                                <td class="timeline-content-td">
                                    <div class="timeline-content">
                                        <div class="timeline-header">
                                            <div class="timeline-title" th:text="${exp.position}"></div>
                                            <div class="timeline-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                                        </div>
                                        <div class="timeline-subtitle" th:text="${exp.company}"></div>
                                        <div class="timeline-desc" th:text="${exp.description}"></div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <!-- EDUCATION -->
                    <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                        <h2 class="section-header">Education</h2>
                        <table class="timeline-container">
                            <tr th:each="edu : ${profile.education}">
                                <td class="timeline-icon-td">
                                    <div class="timeline-icon" style="background-color: #8b949e;"></div>
                                </td>
                                <td class="timeline-content-td">
                                    <div class="timeline-content">
                                        <div class="timeline-header">
                                            <div class="timeline-title" th:text="${edu.institution}"></div>
                                            <div class="timeline-date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                                        </div>
                                        <div class="timeline-subtitle" th:text="${edu.field != null and !edu.field.isEmpty() ? edu.degree + ' in ' + edu.field : edu.degree}"></div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                </th:block>
            </th:block>
            
        </div>
    </div>
</body>
</html>
