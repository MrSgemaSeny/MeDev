<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - GitHub Resume'">GitHub Resume</title>

    <style>
        :root {
            --bg-color: #0d1117;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-green: #238636;
            --accent-blue: #58a6ff;
            --tag-bg: rgba(56, 139, 253, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        @page {
            size: A4;
            margin: 15mm;
            background-color: #0d1117;
        }
        
        /* Browser Preview styling: Fixed dark A4 Sheet centered */
        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #010409;
            color: #c9d1d9;
            line-height: 1.5;
            padding: 30px 15px;
            font-size: 13px;
        }
        .container {
            max-width: 794px; /* Standard A4 width */
            margin: 0 auto;
            background-color: #0d1117;
            padding: 36px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #30363d;
            border-radius: 6px;
            display: table;
            width: 100%;
        }
        
        /* Left Sidebar */
        .sidebar {
            display: table-cell;
            width: 220px;
            padding-right: 24px;
            vertical-align: top;
        }
        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 1px solid #30363d;
            background-color: #161b22;
            overflow: hidden;
            margin: 0 auto 16px auto;
            text-align: center;
            line-height: 130px;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            vertical-align: middle;
        }
        .names { margin-bottom: 16px; }
        .fullname {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.25;
            color: #c9d1d9;
        }
        .username {
            font-size: 15px;
            color: #8b949e;
            font-weight: 300;
            line-height: 22px;
        }
        .bio {
            font-family: Roboto, sans-serif;
            font-size: 13px;
            color: #c9d1d9;
            margin-bottom: 16px;
        }
        .contact-list {
            font-size: 13px;
            margin-bottom: 22px;
        }
        .contact-item { margin-bottom: 6px; }
        .contact-item a { color: #c9d1d9; text-decoration: none; }
        .contact-item a:hover { color: #58a6ff; text-decoration: underline; }
        
        .sidebar-section {
            border-top: 1px solid #30363d;
            padding-top: 14px;
            margin-top: 14px;
            page-break-inside: avoid;
        }
        h3.side-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #c9d1d9;
        }
        
        /* Tags in sidebar */
        .skills-group { margin-bottom: 12px; }
        .skills-group-title {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .tag {
            display: inline-block;
            background-color: #111d2e;
            color: #58a6ff;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 16px;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        
        /* Main Content */
        .main-content {
            display: table-cell;
            vertical-align: top;
            padding-left: 28px;
        }
        .section-header {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
            page-break-after: avoid;
        }
        
        /* Pinned Projects */
        .projects-wrapper { width: 100%; margin-bottom: 24px; }
        .pinned-card {
            display: block;
            width: 100%;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 14px 16px;
            background-color: #0d1117;
            margin-bottom: 12px;
            page-break-inside: avoid;
        }
        .repo-title {
            font-size: 15px;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 6px;
        }
        .repo-title a { color: inherit; text-decoration: none; }
        .repo-desc {
            display: block;
            font-size: 12.5px;
            color: #8b949e;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .repo-meta {
            font-size: 11.5px;
            color: #8b949e;
        }
        .lang-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #238636;
            margin-right: 4px;
            vertical-align: middle;
        }
        
        /* Timeline items */
        .timeline-container { margin-bottom: 24px; width: 100%; border-spacing: 0; border-collapse: separate; page-break-inside: avoid; }
        .timeline-icon-td { width: 16px; vertical-align: top; text-align: right; }
        .timeline-content-td { border-left: 1px solid #30363d; padding-left: 14px; padding-bottom: 18px; vertical-align: top; }
        
        .timeline-icon {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #388bfd;
            border: 2px solid #0d1117;
            margin-top: 4px;
            margin-right: -5.5px;
        }
        
        .timeline-content {
            padding: 0 0 6px 0;
        }
        .timeline-header {
            width: 100%;
            display: table;
            margin-bottom: 3px;
        }
        .timeline-title {
            display: table-cell;
            font-size: 15px;
            font-weight: 600;
            color: #c9d1d9;
        }
        .timeline-date {
            display: table-cell;
            text-align: right;
            font-size: 11.5px;
            color: #8b949e;
        }
        .timeline-subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
        }
        .timeline-desc {
            font-size: 12.5px;
            color: #c9d1d9;
            line-height: 1.45;
        }

        /* ==========================================================================
           Single-page Mode: Proportional scaling for 1-page fit
           ========================================================================== */
        body.single-page {
            padding: 20px 15px;
            font-size: 11px;
            line-height: 1.35;
        }
        .single-page .container {
            padding: 24px 28px;
        }
        .single-page .sidebar { width: 185px; padding-right: 14px; }
        .single-page .avatar { width: 85px; height: 85px; line-height: 85px; margin-bottom: 10px; }
        .single-page .fullname { font-size: 18px; }
        .single-page .username { font-size: 13px; line-height: 16px; }
        .single-page .bio { font-size: 11px; margin-bottom: 10px; }
        .single-page .contact-list { font-size: 11px; margin-bottom: 14px; }
        .single-page .contact-item { margin-bottom: 3px; }
        .single-page .sidebar-section { padding-top: 10px; margin-top: 10px; }
        .single-page h3.side-title { font-size: 13px; margin-bottom: 8px; }
        .single-page .skills-group { margin-bottom: 8px; }
        .single-page .skills-group-title { font-size: 10.5px; margin-bottom: 4px; }
        .single-page .tag { padding: 1.5px 6px; font-size: 9.5px; border-radius: 12px; }
        .single-page .main-content { padding-left: 16px; }
        .single-page .section-header { font-size: 14px; margin-bottom: 10px; padding-bottom: 4px; }
        .single-page .projects-wrapper { margin-bottom: 14px; }
        .single-page .pinned-card { padding: 8px 10px; margin-bottom: 8px; }
        .single-page .repo-title { font-size: 13px; margin-bottom: 4px; }
        .single-page .repo-desc { font-size: 10.5px; line-height: 1.3; margin-bottom: 4px; }
        .single-page .repo-meta { font-size: 10px; }
        .single-page .timeline-container { margin-bottom: 14px; }
        .single-page .timeline-content-td { padding-left: 10px; padding-bottom: 10px; }
        .single-page .timeline-title { font-size: 12.5px; }
        .single-page .timeline-date { font-size: 10px; }
        .single-page .timeline-subtitle { font-size: 11px; margin-bottom: 3px; }
        .single-page .timeline-desc { font-size: 10.5px; line-height: 1.3; }

        /* ==========================================================================
           Print and PDF Engine overrides (Flying Saucer)
           ========================================================================== */
        @media print {
            body, body.single-page {
                background-color: #0d1117 !important;
                padding: 0 !important;
            }
            .container, .single-page .container {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>
<body th:classappend="${singlePage != null and singlePage} ? 'single-page' : 'multi-page'">
    <div class="container">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="avatar" th:if="${profile.githubUsername != null}">
                <img th:src="${avatarBase64 ?: 'https://github.com/' + profile.githubUsername + '.png'}" alt="Avatar" />
            </div>
            <div class="avatar" th:unless="${profile.githubUsername != null}">
                <span th:text="${profile.fullName != null and profile.fullName.length() gt 0 ? profile.fullName.substring(0,1).toUpperCase() : 'U'}" style="font-size: 50px; color: #c9d1d9;"></span>
            </div>
            
            <div class="names">
                <h1 class="fullname" th:text="${profile.fullName}">Name</h1>
                <div class="username" th:text="${profile.githubUsername != null ? profile.githubUsername : profile.fullName.toLowerCase().replace(' ', '')}">username</div>
            </div>
            
            <div class="contact-list">
                <div class="contact-item" th:if="${profile.location != null and !profile.location.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">Loc:</span> <span th:text="${profile.location}"></span></div>
                <div class="contact-item" th:if="${profile.website != null and !profile.website.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">Web:</span> <a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></div>
                <div class="contact-item" th:if="${profile.linkedin != null and !profile.linkedin.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">In:</span> <span th:text="${profile.linkedin}"></span></div>
                <div class="contact-item" th:if="${profile.telegram != null and !profile.telegram.isBlank()}"><span style="color: #8b949e; margin-right: 4px;">Tg:</span> <span th:text="${profile.telegram}"></span></div>
            </div>
            
            <div class="sidebar-section" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                <h3 class="side-title">Skills</h3>
                <div class="skills-group" th:each="entry : ${groupedSkills}">
                    <div class="skills-group-title" th:text="${entry.key}"></div>
                    <div style="margin-top:4px;">
                        <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-section" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                <h3 class="side-title">Languages</h3>
                <div style="font-size: 12px; color: #c9d1d9;" th:text="${languagesStr}"></div>
            </div>
        </div>
        
        <!-- MAIN CONTENT -->
        <div class="main-content">
            
            <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','projects','experience','education'}}">
                <th:block th:switch="${sectionName}">
                    
                    <!-- SUMMARY -->
                    <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                        <div class="timeline-content" style="margin-bottom:24px;">
                            <div th:text="${profile.summary}"></div>
                        </div>
                    </div>

                    <!-- PROJECTS -->
                    <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                        <h2 class="section-header">Pinned Projects</h2>
                        <div class="projects-wrapper">
                            <div class="pinned-card" th:each="proj, stat : ${profile.projects}" th:if="${proj.isVisible and stat.index < 3}">
                                <div class="repo-title">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" th:text="${proj.name}" target="_blank"></a>
                                    <span th:unless="${proj.githubUrl}" th:text="${proj.name}"></span>
                                </div>
                                <div class="repo-desc" th:text="${proj.description}"></div>
                                <div class="repo-meta" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                    <span class="lang-dot" style="font-size: 0;">&nbsp;</span>
                                    <span th:text="${proj.techStack}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- EXPERIENCE -->
                    <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                        <h2 class="section-header">Experience</h2>
                        <table class="timeline-container">
                            <tr th:each="exp : ${profile.experience}">
                                <td class="timeline-icon-td">
                                    <div class="timeline-icon"></div>
                                </td>
                                <td class="timeline-content-td">
                                    <div class="timeline-content">
                                        <div class="timeline-header">
                                            <div class="timeline-title" th:text="${exp.position}"></div>
                                            <div class="timeline-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                                        </div>
                                        <div class="timeline-subtitle" th:text="${exp.company}"></div>
                                        <div class="timeline-desc" th:text="${exp.description}"></div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <!-- EDUCATION -->
                    <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                        <h2 class="section-header">Education</h2>
                        <table class="timeline-container">
                            <tr th:each="edu : ${profile.education}">
                                <td class="timeline-icon-td">
                                    <div class="timeline-icon" style="background-color: #8b949e;"></div>
                                </td>
                                <td class="timeline-content-td">
                                    <div class="timeline-content">
                                        <div class="timeline-header">
                                            <div class="timeline-title" th:text="${edu.institution}"></div>
                                            <div class="timeline-date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                                        </div>
                                        <div class="timeline-subtitle" th:text="${edu.field != null and !edu.field.isEmpty() ? edu.degree + ' in ' + edu.field : edu.degree}"></div>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

                </th:block>
            </th:block>
            
        </div>
    </div>
</body>
</html>
