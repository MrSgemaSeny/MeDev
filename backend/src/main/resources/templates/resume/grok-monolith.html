<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - Grok Dashboard'">Grok</title>
    <style>
        /* Removed CSS variables as they are not supported by Flying Saucer CSS 2.1 */
        @page { margin: 0; background-color: #09090b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            line-height: 1.6;
            padding: 40px;
        }
        .bento-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .bento-card {
            background-color: #000000;
            border: 1px solid #27272a;
            page-break-inside: avoid;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }
        
        /* Profile Header inside card */
        .profile-table { width: 100%; display: table; }
        .profile-avatar { display: table-cell; width: 80px; vertical-align: middle; padding-right: 24px; }
        .profile-info { display: table-cell; vertical-align: middle; }
        .profile-meta { display: table-cell; vertical-align: middle; text-align: right; color: #a1a1aa; }
        
        h1.name { font-size: 36px; font-weight: 700; letter-spacing: -1px; margin-bottom: 4px; }
        .username { color: #a1a1aa; font-size: 16px; }
        
        h2.card-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a1a1aa;
            margin-bottom: 24px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 12px;
        }
        
        /* Typography */
        .text-body { font-size: 15px; color: #f4f4f5; }
        .text-dim { color: #a1a1aa; font-size: 14px; }
        
        /* Feed / Timelines */
        .feed-item {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #27272a;
            page-break-inside: avoid;
        }
        .feed-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        
        .feed-header { width: 100%; display: table; margin-bottom: 6px; }
        .feed-title { display: table-cell; font-size: 18px; font-weight: 600; text-align: left; }
        .feed-date { display: table-cell; font-size: 13px; font-variant-numeric: tabular-nums; color: #a1a1aa; text-align: right; }
        .feed-subtitle { font-size: 15px; color: #a1a1aa; margin-bottom: 12px; }
        
        /* Tags */
        .tags { margin-top: 12px; }
        .tag {
            display: inline-block;
            background: #09090b;
            border: 1px solid #27272a;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            color: #a1a1aa;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        /* Multi-column inside cards */
        .two-col-container { width: 100%; }
        .col-half {
            display: inline-block;
            width: 48%;
            vertical-align: top;
            margin-bottom: 16px;
            page-break-inside: avoid;
        }
        
        /* Contact table */
        .contact-table { width: 100%; display: table; }
        .contact-cell { display: table-cell; vertical-align: top; width: 25%; }
        .contact-label { font-size: 12px; color: #a1a1aa; text-transform: uppercase; margin-bottom: 4px; }
        .contact-value { font-size: 14px; }
        .contact-value a { color: #f4f4f5; text-decoration: none; }
    </style>
</head>
<body>
    <div class="bento-container">
        
        <!-- Profile Card -->
        <div class="bento-card">
            <div class="profile-table">
                <div class="profile-avatar" th:if="${profile.githubUsername != null}">
                    <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden;">
                        <img th:src="${avatarBase64 ?: 'https://github.com/' + profile.githubUsername + '.png'}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;" />
                    </div>
                </div>
                <div class="profile-info">
                    <h1 class="name" th:text="${profile.fullName}">Name</h1>
                    <div class="username" th:text="${profile.githubUsername != null ? '@' + profile.githubUsername : ''}"></div>
                </div>
                <div class="profile-meta">
                    <div th:text="${profile.location}"></div>
                </div>
            </div>
            
            <div class="contact-table" style="margin-top: 32px; padding-top: 24px; border-top: 1px solid #27272a;" th:if="${profile.website != null or profile.linkedin != null or profile.telegram != null}">
                <div class="contact-cell" th:if="${profile.website}">
                    <div class="contact-label">Website</div>
                    <div class="contact-value"><a th:href="${profile.website}" th:text="${profile.website}"></a></div>
                </div>
                <div class="contact-cell" th:if="${profile.githubUsername}">
                    <div class="contact-label">GitHub</div>
                    <div class="contact-value"><a th:href="'https://github.com/' + ${profile.githubUsername}" th:text="${profile.githubUsername}"></a></div>
                </div>
                <div class="contact-cell" th:if="${profile.linkedin}">
                    <div class="contact-label">LinkedIn</div>
                    <div class="contact-value" th:text="${profile.linkedin}"></div>
                </div>
                <div class="contact-cell" th:if="${profile.telegram}">
                    <div class="contact-label">Telegram</div>
                    <div class="contact-value" th:text="${profile.telegram}"></div>
                </div>
            </div>
        </div>

        <!-- Dynamic Sections -->
        <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
            <th:block th:switch="${sectionName}">
                
                <div class="bento-card" th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                    <h2 class="card-title">Summary</h2>
                    <div class="text-body" th:text="${profile.summary}"></div>
                </div>

                <div class="bento-card" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <h2 class="card-title">Experience</h2>
                    <div class="feed-item" th:each="exp : ${profile.experience}">
                        <div class="feed-header">
                            <div class="feed-title" th:text="${exp.position}"></div>
                            <div class="feed-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                        </div>
                        <div class="feed-subtitle" th:text="${exp.company}"></div>
                        <div class="text-body" th:text="${exp.description}"></div>
                        <div class="tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                            <span class="tag" th:text="${exp.techStack}"></span>
                        </div>
                    </div>
                </div>

                <div class="bento-card" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <h2 class="card-title">Education</h2>
                    <div class="feed-item" th:each="edu : ${profile.education}">
                        <div class="feed-header">
                            <div class="feed-title" th:text="${edu.institution}"></div>
                            <div class="feed-date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                        </div>
                        <div class="feed-subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')"></div>
                    </div>
                </div>

                <div class="bento-card" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <h2 class="card-title">Capabilities</h2>
                    <div class="two-col-container">
                        <div class="col-half" th:each="entry : ${groupedSkills}">
                            <div class="text-body" style="font-weight: 600; margin-bottom: 8px;" th:text="${entry.key}"></div>
                            <div class="tags" style="margin-top:0;">
                                <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bento-card" th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                    <h2 class="card-title">Languages</h2>
                    <div class="text-body" th:text="${languagesStr}"></div>
                </div>

                <div class="bento-card" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <h2 class="card-title">Projects</h2>
                    <div class="two-col-container">
                        <div class="col-half" th:each="proj, stat : ${profile.projects}" th:if="${proj.isVisible and stat.index < 3}" style="padding-right: 20px;">
                            <div class="feed-title" style="margin-bottom: 4px;" th:text="${proj.name}"></div>
                            <div class="text-dim" style="margin-bottom: 8px;">
                                <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank" style="color:#a1a1aa; text-decoration:none;">GitHub</a>
                                <span th:if="${proj.githubUrl != null and proj.liveUrl != null}"> &middot; </span>
                                <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank" style="color:#a1a1aa; text-decoration:none;">Live</a>
                            </div>
                            <div class="text-body" style="font-size: 14px; margin-bottom: 12px;" th:text="${proj.description}"></div>
                            <div class="tags" style="margin-top:0;" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                <span class="tag" th:text="${proj.techStack}"></span>
                            </div>
                        </div>
                    </div>
                </div>

            </th:block>
        </th:block>

    </div>
</body>
</html>
