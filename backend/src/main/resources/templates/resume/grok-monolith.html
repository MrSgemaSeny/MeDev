<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - Grok Dashboard'">Grok</title>
    <style>
        @page { margin: 0; background-color: #09090b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            line-height: 1.4;
            padding: 24px;
            font-size: 11px;
        }
        .bento-container {
            max-width: 100%;
            margin: 0 auto;
            width: 100%;
        }
        .bento-container::after {
            content: "";
            display: table;
            clear: both;
        }
        .bento-card {
            background-color: #000000;
            border: 1px solid #27272a;
            page-break-inside: avoid;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            float: left;
            font-size: 11px;
        }
        
        /* Grid Spans using percentages */
        /* Flying Saucer doesn't support calc well, so we use precise percentages.
           We'll use a 24px gap approx 2.6%.
        */
        .card-profile { width: 100%; }
        
        .card-contact { width: 31%; margin-right: 2%; }
        .card-summary { width: 65%; }
        
        .card-experience { width: 65%; margin-right: 2%; }
        .card-education { width: 31%; }
        
        .card-skills { width: 48%; margin-right: 2%; }
        .card-languages { width: 48%; }
        
        .card-projects { width: 100%; }

        /* Profile Header inside card */
        .profile-table { width: 100%; display: table; }
        .profile-avatar { display: table-cell; width: 60px; vertical-align: middle; padding-right: 16px; }
        .profile-info { display: table-cell; vertical-align: middle; }
        .profile-meta { display: table-cell; vertical-align: middle; text-align: right; color: #a1a1aa; }
        
        h1.name { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 2px; }
        .username { color: #a1a1aa; font-size: 12px; }
        
        h2.card-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a1a1aa;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #27272a;
        }
        
        /* Typography */
        .text-body { font-size: 11px; color: #f4f4f5; line-height: 1.4; }
        .text-dim { color: #a1a1aa; font-size: 10px; }
        
        /* Connect List */
        .contact-row {
            width: 100%;
            display: table;
            border-bottom: 1px solid #27272a;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .contact-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .contact-row-left { display: table-cell; color: #a1a1aa; font-size: 11px; }
        .contact-row-right { display: table-cell; text-align: right; font-size: 11px; }
        .contact-row-right a { color: #f4f4f5; text-decoration: none; }
        
        /* Feed / Timelines */
        .feed-item {
            margin-bottom: 12px;
            padding-left: 12px;
            border-left: 2px solid #27272a;
            position: relative;
            page-break-inside: avoid;
        }
        .feed-item::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #27272a;
        }
        .feed-item:last-child { margin-bottom: 0; }
        .feed-header { display: table; width: 100%; margin-bottom: 2px; }
        .feed-title { display: table-cell; font-size: 12px; font-weight: 600; text-align: left; }
        .feed-date { display: table-cell; font-size: 10px; color: #a1a1aa; text-align: right; }
        .feed-subtitle { font-size: 11px; color: #a1a1aa; margin-bottom: 4px; }
        
        /* Tags */
        .tags { margin-top: 8px; }
        .tag {
            display: inline-block;
            background: #09090b;
            border: 1px solid #27272a;
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 500;
            color: #a1a1aa;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        
        /* Projects Grid removed in favor of feed-item */
        
        .skill-group { margin-bottom: 12px; page-break-inside: avoid; }
        .skill-group-title { font-size: 11px; font-weight: 600; color: #f4f4f5; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="bento-container">
        
        <!-- Profile Header -->
        <div class="bento-card card-profile">
            <div class="profile-table">
                <div class="profile-avatar" th:if="${profile.githubUsername != null}">
                    <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden;">
                        <img th:src="${avatarBase64 ?: 'https://github.com/' + profile.githubUsername + '.png'}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;" />
                    </div>
                </div>
                <div class="profile-info">
                    <h1 class="name" th:text="${profile.fullName}">Name</h1>
                    <div class="username" th:text="${profile.githubUsername != null ? '@' + profile.githubUsername : ''}"></div>
                </div>
                <div class="profile-meta">
                    <div th:text="${profile.location}"></div>
                </div>
            </div>
        </div>

        <!-- Connect Card -->
        <div class="bento-card card-contact" th:if="${profile.website != null or profile.linkedin != null or profile.telegram != null}">
            <h2 class="card-title">Connect</h2>
            <div class="contact-row" th:if="${profile.website}">
                <div class="contact-row-left">Web</div>
                <div class="contact-row-right"><a th:href="${profile.website}" th:text="${profile.website}"></a></div>
            </div>
            <div class="contact-row" th:if="${profile.githubUsername}">
                <div class="contact-row-left">GitHub</div>
                <div class="contact-row-right"><a th:href="'https://github.com/' + ${profile.githubUsername}" th:text="${profile.githubUsername}"></a></div>
            </div>
            <div class="contact-row" th:if="${profile.linkedin}">
                <div class="contact-row-left">LinkedIn</div>
                <div class="contact-row-right"><span th:text="${profile.linkedin}"></span></div>
            </div>
            <div class="contact-row" th:if="${profile.telegram}">
                <div class="contact-row-left">Telegram</div>
                <div class="contact-row-right"><span th:text="${profile.telegram}"></span></div>
            </div>
        </div>

        <!-- Dynamic Sections -->
        <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
            <th:block th:switch="${sectionName}">
                
                <div class="bento-card card-summary" th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                    <h2 class="card-title">Summary</h2>
                    <div class="text-body" th:text="${profile.summary}"></div>
                </div>

                <div class="bento-card card-experience" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <h2 class="card-title">Experience</h2>
                    <div class="feed-item" th:each="exp : ${profile.experience}">
                        <div class="feed-header">
                            <div class="feed-title" th:text="${exp.position}"></div>
                            <div class="feed-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                        </div>
                        <div class="feed-subtitle" th:text="${exp.company}"></div>
                        <div class="text-body" th:text="${exp.description}"></div>
                        <div class="tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                            <span class="tag" th:text="${exp.techStack}"></span>
                        </div>
                    </div>
                </div>

                <div class="bento-card card-education" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <h2 class="card-title">Education</h2>
                    <div class="feed-item" th:each="edu : ${profile.education}">
                        <div class="feed-header">
                            <div class="feed-title" th:text="${edu.institution}"></div>
                        </div>
                        <div class="feed-subtitle" th:text="${edu.degree} + (edu.fieldOfStudy != null ? ' in ' + edu.fieldOfStudy : '')"></div>
                        <div class="feed-date" style="text-align: left; margin-top: 4px;" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                    </div>
                </div>

                <div class="bento-card card-skills" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <h2 class="card-title">Capabilities</h2>
                    <div class="skill-group" th:each="entry : ${groupedSkills}">
                        <div class="skill-group-title" th:text="${entry.key}"></div>
                        <div class="tags" style="margin-top:0;">
                            <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                        </div>
                    </div>
                </div>

                <div class="bento-card card-languages" th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                    <h2 class="card-title">Languages</h2>
                    <div class="text-body" th:text="${languagesStr}"></div>
                </div>

                <div class="bento-card card-projects" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <h2 class="card-title">Projects</h2>
                    <div style="display: table; width: 100%; table-layout: fixed;">
                        <!-- Left Column (First Half) -->
                        <div style="display: table-cell; width: 48%; vertical-align: top;">
                            <div style="border: 1px solid #27272a; border-radius: 12px; padding: 16px; background: #09090b; margin-bottom: 16px; page-break-inside: avoid;" th:each="proj, stat : ${profile.projects}" th:if="${proj.isVisible and stat.index < (profile.projects.size() + 1) / 2}">
                                <div class="feed-header" style="margin-bottom: 10px;">
                                    <div class="feed-title" style="font-size: 15px; font-weight: 700;" th:text="${proj.name}"></div>
                                    <div class="feed-date" style="text-align: right;">
                                        <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" style="color:#a1a1aa; text-decoration:none; margin-left:12px; font-size: 12px;">Git</a>
                                        <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" style="color:#a1a1aa; text-decoration:none; margin-left:12px; font-size: 12px;">Live</a>
                                    </div>
                                </div>
                                <div class="text-body" style="font-size: 13px; margin-bottom: 12px;" th:text="${proj.description}"></div>
                                <div class="tags" style="margin-top:0;" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                    <span class="tag" style="padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 500;" th:text="${proj.techStack}"></span>
                                </div>
                            </div>
                        </div>
                        <!-- Spacer Column -->
                        <div style="display: table-cell; width: 4%;"></div>
                        <!-- Right Column (Second Half) -->
                        <div style="display: table-cell; width: 48%; vertical-align: top;">
                            <div style="border: 1px solid #27272a; border-radius: 12px; padding: 16px; background: #09090b; margin-bottom: 16px; page-break-inside: avoid;" th:each="proj, stat : ${profile.projects}" th:if="${proj.isVisible and stat.index >= (profile.projects.size() + 1) / 2}">
                                <div class="feed-header" style="margin-bottom: 10px;">
                                    <div class="feed-title" style="font-size: 15px; font-weight: 700;" th:text="${proj.name}"></div>
                                    <div class="feed-date" style="text-align: right;">
                                        <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" style="color:#a1a1aa; text-decoration:none; margin-left:12px; font-size: 12px;">Git</a>
                                        <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" style="color:#a1a1aa; text-decoration:none; margin-left:12px; font-size: 12px;">Live</a>
                                    </div>
                                </div>
                                <div class="text-body" style="font-size: 13px; margin-bottom: 12px;" th:text="${proj.description}"></div>
                                <div class="tags" style="margin-top:0;" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                    <span class="tag" style="padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 500;" th:text="${proj.techStack}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </th:block>
        </th:block>

    </div>
</body>
</html>
