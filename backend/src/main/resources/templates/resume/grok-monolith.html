<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - Grok Dashboard'">Grok</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-body: #09090b;
            --bg-card: #000000;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
        }
        .bento-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
        }
        .bento-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            display: flex;
            flex-direction: column;
        }
        
        /* Grid Spans */
        .card-profile { grid-column: span 12; display: flex; justify-content: space-between; align-items: center; }
        .card-summary { grid-column: span 8; }
        .card-contact { grid-column: span 4; }
        .card-experience { grid-column: span 8; }
        .card-education { grid-column: span 4; }
        .card-skills { grid-column: span 6; }
        .card-languages { grid-column: span 6; }
        .card-projects { grid-column: span 12; }
        
        @media (max-width: 1024px) {
            .card-summary, .card-experience { grid-column: span 12; }
            .card-contact, .card-education { grid-column: span 12; }
        }
        @media (max-width: 768px) {
            .bento-container { display: flex; flex-direction: column; }
            .card-profile { flex-direction: column; align-items: flex-start; gap: 16px; }
            body { padding: 20px; }
        }

        h1 { font-size: 40px; font-weight: 700; letter-spacing: -1.5px; }
        .username { color: var(--text-secondary); font-size: 18px; margin-top: 4px; }
        h2.card-title { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
        h2.card-title::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--text-primary); border-radius: 50%; }
        
        /* Typography */
        .text-body { font-size: 16px; color: var(--text-primary); }
        .text-dim { color: var(--text-secondary); }
        
        /* Links & Pills */
        a { color: var(--text-primary); text-decoration: none; transition: opacity 0.2s; }
        a:hover { opacity: 0.7; }
        
        .contact-list { display: flex; flex-direction: column; gap: 12px; }
        .contact-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; font-size: 15px; }
        .contact-row:last-child { border-bottom: none; }
        
        /* Lists */
        .feed { display: flex; flex-direction: column; gap: 24px; }
        .feed-item { border-left: 2px solid var(--border-color); padding-left: 16px; position: relative; }
        .feed-item::before { content: ''; position: absolute; left: -5px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--border-color); }
        .feed-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .feed-title { font-size: 18px; font-weight: 600; }
        .feed-date { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
        .feed-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 8px; }
        
        /* Grid Layouts inside cards */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .project-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; background: var(--bg-body); }
        .project-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .project-links a { color: var(--text-secondary); font-size: 14px; margin-left: 8px; }
        
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .tag { background: var(--bg-body); border: 1px solid var(--border-color); padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
        
        .skills-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .skill-group-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="bento-container">
        
        <!-- Profile Header -->
        <div class="bento-item card-profile" style="display: flex; gap: 24px; align-items: center;">
            <div th:if="${profile.githubUsername != null}" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; flex-shrink: 0;">
                <img th:src="@{'https://github.com/' + ${profile.githubUsername} + '.png'}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>
            <div style="flex-grow: 1;">
                <h1 th:text="${profile.fullName}">Name</h1>
                <div class="username" th:text="${profile.githubUsername != null ? '@' + profile.githubUsername : ''}"></div>
            </div>
            <div style="text-align: right; color: var(--text-secondary);">
                <div th:text="${profile.location}"></div>
            </div>
        </div>

        <!-- Contact (Span 4) -->
        <div class="bento-item card-contact" th:if="${profile.website != null or profile.linkedin != null or profile.telegram != null}">
            <h2 class="card-title">Connect</h2>
            <div class="contact-list">
                <div class="contact-row" th:if="${profile.website}">
                    <span class="text-dim">Web</span>
                    <a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a>
                </div>
                <div class="contact-row" th:if="${profile.githubUsername}">
                    <span class="text-dim">GitHub</span>
                    <a th:href="'https://github.com/' + ${profile.githubUsername}" th:text="${profile.githubUsername}" target="_blank"></a>
                </div>
                <div class="contact-row" th:if="${profile.linkedin}">
                    <span class="text-dim">LinkedIn</span>
                    <span th:text="${profile.linkedin}"></span>
                </div>
                <div class="contact-row" th:if="${profile.telegram}">
                    <span class="text-dim">Telegram</span>
                    <span th:text="${profile.telegram}"></span>
                </div>
            </div>
        </div>

        <!-- Dynamic Sections -->
        <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
            <th:block th:switch="${sectionName}">
                
                <div class="bento-item card-summary" th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                    <h2 class="card-title">Summary</h2>
                    <div class="text-body" th:text="${profile.summary}"></div>
                </div>

                <div class="bento-item card-experience" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <h2 class="card-title">Experience</h2>
                    <div class="feed">
                        <div class="feed-item" th:each="exp : ${profile.experience}">
                            <div class="feed-header">
                                <div class="feed-title" th:text="${exp.position}"></div>
                                <div class="feed-date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                            </div>
                            <div class="feed-subtitle" th:text="${exp.company}"></div>
                            <div class="text-body" th:text="${exp.description}"></div>
                            <div class="tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                                <span class="tag" th:text="${exp.techStack}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bento-item card-education" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <h2 class="card-title">Education</h2>
                    <div class="feed">
                        <div class="feed-item" th:each="edu : ${profile.education}">
                            <div class="feed-header">
                                <div class="feed-title" th:text="${edu.institution}"></div>
                            </div>
                            <div class="feed-subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')"></div>
                            <div class="feed-date text-dim" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                        </div>
                    </div>
                </div>

                <div class="bento-item card-skills" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <h2 class="card-title">Capabilities</h2>
                    <div class="skills-grid">
                        <div th:each="entry : ${groupedSkills}">
                            <div class="skill-group-title" th:text="${entry.key}"></div>
                            <div class="tags" style="margin-top:0;">
                                <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bento-item card-languages" th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                    <h2 class="card-title">Languages</h2>
                    <div class="text-body" th:text="${languagesStr}"></div>
                </div>

                <div class="bento-item card-projects" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <h2 class="card-title">Projects</h2>
                    <div class="projects-grid">
                        <div class="project-card" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                            <div class="project-header">
                                <div class="feed-title" th:text="${proj.name}"></div>
                                <div class="project-links">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank">Git</a>
                                    <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank">Live</a>
                                </div>
                            </div>
                            <div class="text-body" style="font-size: 14px; margin-bottom: 16px;" th:text="${proj.description}"></div>
                            <div class="tags" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                <span class="tag" th:text="${proj.techStack}"></span>
                            </div>
                        </div>
                    </div>
                </div>

            </th:block>
        </th:block>

    </div>
</body>
</html>
