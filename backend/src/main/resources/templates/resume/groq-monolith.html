<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Groq Monolith Style Resume</title>
    <style>
        @page { size: A4; margin: 15mm; }
        body { font-family: 'Courier New', Courier, monospace; background-color: #000000; color: #FFFFFF; margin: 0; font-size: 11px; line-height: 1.4; border: 1px solid #333333; padding: 20px; }
        .header { border-bottom: 2px solid #F87171; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: #FFFFFF; font-size: 34px; margin: 0 0 10px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .contact { color: #A1A1AA; font-size: 10px; margin-bottom: 15px; }
        .contact span { margin-right: 15px; display: inline-block; }
        a { color: #F87171; text-decoration: none; }
        h2 { color: #F87171; font-size: 14px; border-bottom: 1px solid #333333; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .layout { width: 100%; border-collapse: collapse; margin-bottom: 3px; }
        .layout td { vertical-align: top; padding: 0; }
        .left { text-align: left; font-weight: bold; font-size: 12px; color: #FFFFFF; }
        .right { text-align: right; font-size: 10px; color: #A1A1AA; text-transform: uppercase; }
        .item { margin-bottom: 20px; border-left: 1px solid #333333; padding-left: 10px; }
        .item-subheader { color: #A1A1AA; font-size: 11px; margin-bottom: 5px; text-transform: uppercase; }
        .item-desc { font-size: 11px; color: #FFFFFF; }
        .tech-tag { display: inline-block; border: 1px solid #F87171; padding: 2px 6px; margin-right: 5px; margin-top: 5px; font-size: 9px; color: #F87171; text-transform: uppercase; }
        .skills-table { width: 100%; border-collapse: collapse; border-top: 1px solid #333333; }
        .skills-table td { padding: 8px 0; vertical-align: top; border-bottom: 1px solid #333333; }
        .cat-col { width: 30%; color: #FFFFFF; font-weight: bold; text-transform: uppercase; font-size: 10px; }
        .det-col { width: 70%; color: #A1A1AA; }
        .footer { margin-top: 30px; font-size: 9px; color: #333333; text-align: right; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${profile.fullName}">Name</h1>
        <div class="contact">
            <span th:if="${profile.location}">[LOC] <span th:text="${profile.location}"></span></span>
            <span th:if="${profile.website}">[WEB] <a th:href="${profile.website}" th:text="${profile.website}"></a></span>
            <span th:if="${profile.githubUsername}">[GIT] <span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}">[IN] <span th:text="${profile.linkedin}"></span></span>
            <span th:if="${profile.telegram}">[TG] <span th:text="${profile.telegram}"></span></span>
        </div>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
        <div th:switch="${sectionName}">
            
            <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                <h2>// SYS.INIT</h2>
                <div class="item-desc" th:text="${profile.summary}"></div>
            </div>

            <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                <h2>// EXPERIENCE</h2>
                <div class="item" th:each="exp : ${profile.experience}">
                    <table class="layout">
                        <tr>
                            <td class="left" th:text="${exp.position}">Position</td>
                            <td class="right" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</td>
                        </tr>
                    </table>
                    <div class="item-subheader" th:text="${exp.company}">Company</div>
                    <div class="item-desc" th:text="${exp.description}">Description</div>
                    <div th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                        <span class="tech-tag" th:text="${exp.techStack}"></span>
                    </div>
                </div>
            </div>

            <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                <h2>// EDUCATION</h2>
                <div class="item" th:each="edu : ${profile.education}">
                    <table class="layout">
                        <tr>
                            <td class="left" th:text="${edu.institution}">Institution</td>
                            <td class="right" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</td>
                        </tr>
                    </table>
                    <div class="item-subheader" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                </div>
            </div>

            <div th:case="'skills'" th:if="${profile.skills != null and !profile.skills.isEmpty()}">
                <h2>// TECH_STACK</h2>
                <table class="skills-table">
                    <tr th:each="skill : ${profile.skills}">
                        <td class="cat-col" th:text="${skill.category != null ? skill.category : 'CORE'}"></td>
                        <td class="det-col">
                            <span class="tech-tag" th:text="${skill.name}"></span>
                        </td>
                    </tr>
                </table>
            </div>

            <div th:case="'languages'" th:if="${profile.languages != null and !profile.languages.isEmpty()}">
                <h2>// LANGUAGES</h2>
                <table class="skills-table">
                    <tr th:each="lang : ${profile.languages}">
                        <td class="cat-col" th:text="${lang.name}"></td>
                        <td class="det-col" style="color: #F87171;" th:text="${lang.level != null ? lang.level : ''}"></td>
                    </tr>
                </table>
            </div>

            <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                <h2>// PROJECTS</h2>
                <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                    <table class="layout">
                        <tr>
                            <td class="left" th:text="${proj.name}">Project Name</td>
                            <td class="right">
                                <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}">[SRC]</a>
                                <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}">[LIVE]</a>
                            </td>
                        </tr>
                    </table>
                    <div class="item-desc" th:text="${proj.description}">Description</div>
                    <div th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                        <span class="tech-tag" th:text="${proj.techStack}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        [MEDEV_GEN_V1]
    </div>
</body>
</html>
