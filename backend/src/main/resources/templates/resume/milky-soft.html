<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - Editorial Resume'">Editorial</title>
    <style>
        /* Removed CSS variables as they are not supported by Flying Saucer CSS 2.1 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Lora', Roboto, Georgia, serif;
            background-color: #fdfcf9;
            color: #1a1a1a;
            line-height: 1.6;
            margin: 0;
            padding: 40px;
        }
        
        /* Single Column Layout for PDF (Matches narrow Live Preview) */
        @page { size: A4; margin: 0; background-color: #fdfcf9; }
        .magazine-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .sidebar {
            position: relative;
            width: 100%;
            border-bottom: 1px solid #d1d0c8;
            padding-bottom: 30px;
            margin-bottom: 40px;
        }
        
        .content-stream {
            width: 100%;
        }
        
        /* Typography */
        h1.name {
            font-family: 'Playfair Display', Roboto, serif;
            font-size: 38px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        
        .byline {
            font-size: 14px;
            color: #1e4d3f;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 30px;
        }
        
        /* Contact Info */
        .contact-group { margin-bottom: 16px; }
        .contact-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4a4a;
            display: block;
            margin-bottom: 2px;
            font-family: Roboto, sans-serif;
            font-weight: 600;
        }
        .contact-value, .contact-value a {
            font-size: 14px;
            color: #1a1a1a;
            text-decoration: none;
        }
        .contact-value a:hover { color: #1e4d3f; text-decoration: underline; }
        
        /* Main Sections */
        .section-wrapper { margin-bottom: 40px; }
        
        h2.section-header {
            font-family: 'Playfair Display', Roboto, serif;
            font-size: 22px;
            font-weight: 700;
            color: #1e4d3f;
            border-bottom: 1px solid #d1d0c8;
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-transform: capitalize;
        }
        
        /* Summary */
        .pull-quote {
            font-size: 18px;
            line-height: 1.7;
            font-style: italic;
            color: #1a1a1a;
            border-left: 3px solid #1e4d3f;
            padding-left: 20px;
            margin: 0 0 40px 0;
        }
        
        /* Experience / Education Entries */
        .exp-entry { margin-bottom: 24px; page-break-inside: avoid; }
        .exp-entry:last-child { margin-bottom: 0; }
        
        .exp-header {
            width: 100%;
            display: table;
            margin-bottom: 4px;
        }
        .exp-title {
            display: table-cell;
            font-size: 18px;
            font-weight: 600;
            text-align: left;
        }
        .exp-date {
            display: table-cell;
            font-size: 14px;
            color: #4a4a4a;
            font-style: italic;
            text-align: right;
        }
        .exp-company {
            font-size: 15px;
            color: #1e4d3f;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .exp-desc {
            font-size: 14px;
            color: #4a4a4a;
            margin-bottom: 8px;
        }
        .exp-tech {
            font-size: 12px;
            font-family: Roboto, sans-serif;
            color: #4a4a4a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Skills */
        .skills-prose { font-size: 14px; line-height: 1.8; color: #4a4a4a; }
        .skill-cat { font-weight: 600; color: #1a1a1a; margin-right: 6px; }
        .skill-items { font-variant: small-caps; letter-spacing: 0.5px; font-size: 15px; }
        .skill-row { margin-bottom: 10px; page-break-inside: avoid; }

        /* Projects */
        .proj-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dotted #d1d0c8;
            page-break-inside: avoid;
        }
        .proj-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        
        .proj-header { width: 100%; display: table; margin-bottom: 6px; }
        .proj-name { display: table-cell; font-size: 17px; font-weight: 600; text-align: left; }
        .proj-links { display: table-cell; text-align: right; }
        .proj-links a {
            font-size: 11px;
            font-family: Roboto, sans-serif;
            text-transform: uppercase;
            color: #1e4d3f;
            text-decoration: none;
            margin-left: 10px;
            font-weight: 600;
        }
        .proj-desc { font-size: 14px; color: #4a4a4a; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="magazine-wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div th:if="${profile.githubUsername != null}" style="width: 100px; height: 100px; border-radius: 50%; overflow: hidden; margin-bottom: 24px;">
                <img th:src="${avatarBase64 ?: 'https://github.com/' + profile.githubUsername + '.png'}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>
            <h1 class="name" th:text="${profile.fullName}">Name</h1>
            <div class="byline" th:if="${profile.location}" th:text="${profile.location}">Location</div>
            
            <div class="contact-group" th:if="${profile.website}">
                <span class="contact-label">Website</span>
                <span class="contact-value"><a th:href="${profile.website}" th:text="${profile.website}" target="_blank"></a></span>
            </div>
            <div class="contact-group" th:if="${profile.githubUsername}">
                <span class="contact-label">GitHub</span>
                <span class="contact-value"><a th:href="'https://github.com/' + ${profile.githubUsername}" th:text="${profile.githubUsername}" target="_blank"></a></span>
            </div>
            <div class="contact-group" th:if="${profile.linkedin}">
                <span class="contact-label">LinkedIn</span>
                <span class="contact-value" th:text="${profile.linkedin}"></span>
            </div>
            <div class="contact-group" th:if="${profile.telegram}">
                <span class="contact-label">Telegram</span>
                <span class="contact-value" th:text="${profile.telegram}"></span>
            </div>
        </div>

        <!-- Right Content Stream -->
        <div class="content-stream">
            <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
                <th:block th:switch="${sectionName}">
                    
                    <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                        <blockquote class="pull-quote" th:text="${profile.summary}"></blockquote>
                    </div>

                    <div class="section-wrapper" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                        <h2 class="section-header">Professional Experience</h2>
                        <div class="exp-entry" th:each="exp : ${profile.experience}">
                            <div class="exp-header">
                                <div class="exp-title" th:text="${exp.position}"></div>
                                <div class="exp-date" th:text="${exp.startDate + ' — ' + (exp.isCurrent ? 'Present' : exp.endDate)}"></div>
                            </div>
                            <div class="exp-company" th:text="${exp.company}"></div>
                            <div class="exp-desc" th:text="${exp.description}"></div>
                            <div class="exp-tech" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}" th:text="${'Tech: ' + exp.techStack}"></div>
                        </div>
                    </div>

                    <div class="section-wrapper" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                        <h2 class="section-header">Education</h2>
                        <div class="exp-entry" th:each="edu : ${profile.education}">
                            <div class="exp-header">
                                <div class="exp-title" th:text="${edu.institution}"></div>
                                <div class="exp-date" th:text="${edu.startDate + ' — ' + (edu.isCurrent ? 'Present' : edu.endDate)}"></div>
                            </div>
                            <div class="exp-desc" th:text="${edu.field != null and !edu.field.isEmpty() ? edu.degree + ' in ' + edu.field : edu.degree}"></div>
                        </div>
                    </div>

                    <div class="section-wrapper" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                        <h2 class="section-header">Capabilities &amp; Tools</h2>
                        <div class="skills-prose">
                            <div class="skill-row" th:each="entry : ${groupedSkills}">
                                <span class="skill-cat" th:text="${entry.key + ':'}"></span>
                                <span class="skill-items">
                                    <th:block th:each="skillName, iterStat : ${entry.value}">
                                        <span th:text="${skillName}"></span><span th:if="${!iterStat.last}">, </span>
                                    </th:block>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="section-wrapper" th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                        <h2 class="section-header">Languages</h2>
                        <div class="skills-prose" th:text="${languagesStr}"></div>
                    </div>

                    <div class="section-wrapper" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                        <h2 class="section-header">Selected Works</h2>
                        <div class="proj-item" th:each="proj, stat : ${profile.projects}" th:if="${proj.isVisible and stat.index < 3}">
                            <div class="proj-header">
                                <div class="proj-name" th:text="${proj.name}"></div>
                                <div class="proj-links">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" target="_blank">GH</a>
                                    <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" target="_blank">LIVE</a>
                                </div>
                            </div>
                            <div class="proj-desc" th:text="${proj.description}"></div>
                            <div class="exp-tech" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}" th:text="${proj.techStack}"></div>
                        </div>
                    </div>

                </th:block>
            </th:block>
        </div>
    </div>
</body>
</html>
