<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${profile.fullName} + ' - Milky Soft Resume'">Murat Orynbasar - Milky Soft Resume</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');
        
        @page {
            size: A4;
            margin: 15mm;
            background-color: #f9f6f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Lora', serif;
            background-color: #f9f6f0;
            color: #3e3a37;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            max-width: 960px;
            margin: 0 auto;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
            border-bottom: 1px solid #e5ded3;
            padding-bottom: 50px;
            display: block;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 700;
            color: #3e3a37;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        .contact-info {
            text-align: center;
            color: #706b65;
            font-size: 14px;
            font-style: italic;
        }
        
        .contact-item {
            display: inline-block;
            margin: 0 12px;
        }
        
        .contact-info a {
            color: #8da191;
            text-decoration: none;
        }
        
        .layout {
            display: block;
        }
        
        .section {
            margin-bottom: 60px;
            display: block;
        }
        
        /* Faking flex-grow line in CSS 2.1 for section titles */
        .section-title-table {
            display: table;
            width: 100%;
            margin-bottom: 30px;
        }
        
        h2.section-title-text {
            display: table-cell;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #3e3a37;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding-right: 16px;
            white-space: nowrap;
            width: 1%; /* shrink to fit */
            vertical-align: middle;
        }
        
        .section-title-line {
            display: table-cell;
            width: 99%;
            vertical-align: middle;
        }
        
        .section-title-line div {
            border-bottom: 1px solid #e5ded3;
        }
        
        .summary-text {
            font-size: 17px;
            line-height: 1.9;
            color: #3e3a37;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            font-style: italic;
            margin-bottom: 60px;
            display: block;
        }
        
        .item-list {
            display: block;
        }
        
        .item {
            margin-bottom: 40px;
            display: block;
            page-break-inside: avoid;
        }
        .item:last-child { margin-bottom: 0; }
        
        .item-header {
            display: block;
            margin-bottom: 12px;
        }
        
        .item-title {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            color: #3e3a37;
            margin-bottom: 4px;
        }
        
        .item-meta {
            float: right;
            color: #706b65;
            font-size: 14px;
            font-style: italic;
            text-align: right;
        }
        
        .item-subtitle {
            clear: both;
            color: #706b65;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .item-desc {
            clear: both;
            font-size: 15px;
            color: #3e3a37;
        }
        
        .tags {
            display: block;
            margin-top: 16px;
        }
        
        .tag {
            display: inline-block;
            background-color: transparent;
            color: #8da191;
            border: 1px solid #8da191;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-family: -apple-system, sans-serif;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        /* Skills Table Layout */
        .skills-table {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        
        .skills-col {
            display: table-cell;
            width: 48%;
            vertical-align: top;
        }
        .skills-col-left { padding-right: 2%; }
        .skills-col-right { padding-left: 2%; }
        
        .skill-group {
            background-color: #fcfbf9;
            border: 1px solid #e5ded3;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 32px;
            page-break-inside: avoid;
        }
        
        .skill-group-name {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #d4b7a1;
        }
        
        .clear { clear: both; }
        
        /* Multi-page specifics */
        body.multi-page {
            padding: 20px;
        }

        /* Single-page Mode: Proportional scaling for 1-page fit */
        body.single-page {
            padding: 10px;
        }
        body.single-page .header { margin-bottom: 16px; padding-bottom: 12px; }
        body.single-page h1 { font-size: 26px; margin-bottom: 4px; }
        body.single-page .contact-info { font-size: 11px; }
        body.single-page .contact-item { margin: 0 6px; }
        body.single-page .summary-text { font-size: 12px; margin-bottom: 16px; line-height: 1.4; }
        body.single-page .section { margin-bottom: 16px; }
        body.single-page .section-title-table { margin-bottom: 12px; }
        body.single-page .section-title-text { font-size: 16px; padding-right: 10px; }
        body.single-page .item { margin-bottom: 12px; }
        body.single-page .item-header { margin-bottom: 2px; }
        body.single-page .item-title { font-size: 14px; margin-bottom: 0; }
        body.single-page .item-meta { font-size: 11px; }
        body.single-page .item-subtitle { font-size: 12px; margin-bottom: 4px; }
        body.single-page .item-desc { font-size: 11px; }
        body.single-page .tags { margin-top: 4px; }
        body.single-page .tag { padding: 2px 8px; font-size: 9px; margin-right: 4px; margin-bottom: 4px; }
        body.single-page .skill-group { padding: 12px; margin-bottom: 12px; }
        body.single-page .skill-group-name { font-size: 12px; margin-bottom: 6px; }
    </style>
</head>
<body th:class="${singlePage != null and singlePage ? 'single-page' : 'multi-page'}">
    
    <div class="header">
        <h1 th:text="${profile.fullName}">Murat Orynbasar</h1>
        <div class="contact-info">
            <span class="contact-item" th:if="${profile.location}" th:text="${profile.location}">Kazakhstan, Almaty/Shymkent</span>
            <span class="contact-item" th:if="${profile.website}"><a th:href="${profile.website}" target="_blank" th:text="${profile.website}"></a></span>
            <span class="contact-item" th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></span>
            <span class="contact-item" th:if="${profile.linkedin}"><span th:text="${profile.linkedin}"></span></span>
            <span class="contact-item" th:if="${profile.telegram}"><span th:text="${profile.telegram}"></span></span>
        </div>
    </div>

    <div class="layout">
        
        <!-- Summary handled uniquely if it's in order -->
        <th:block th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
            <th:block th:switch="${sectionName}">
                
                <!-- Summary -->
                <div class="section" th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                    <div class="summary-text" th:text="${profile.summary}"></div>
                </div>

                <!-- Experience -->
                <div class="section" th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <div class="section-title-table">
                        <h2 class="section-title-text">Experience</h2>
                        <div class="section-title-line"><div></div></div>
                    </div>
                    <div class="item-list">
                        <div class="item" th:each="exp : ${profile.experience}">
                            <div class="item-header">
                                <div class="item-title" th:text="${exp.position}">Position</div>
                                <div class="item-meta" th:text="${exp.startDate + ' - ' + (exp.isCurrent != null and exp.isCurrent ? 'Present' : exp.endDate)}">Date</div>
                                <div class="clear"></div>
                            </div>
                            <div class="item-subtitle" th:text="${exp.company}">Company</div>
                            <div class="item-desc" th:text="${exp.description}">Description</div>
                            <div class="tags" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}">
                                <span class="tag" th:text="${exp.techStack}">Tech Stack</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Education -->
                <div class="section" th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <div class="section-title-table">
                        <h2 class="section-title-text">Education</h2>
                        <div class="section-title-line"><div></div></div>
                    </div>
                    <div class="item-list">
                        <div class="item" th:each="edu : ${profile.education}">
                            <div class="item-header">
                                <div class="item-title" th:text="${edu.institution}">Institution</div>
                                <div class="item-meta" th:text="${edu.startDate + ' - ' + (edu.isCurrent != null and edu.isCurrent ? 'Present' : edu.endDate)}">Date</div>
                                <div class="clear"></div>
                            </div>
                            <div class="item-subtitle" th:text="${edu.field != null and !edu.field.isEmpty() ? edu.degree + ' in ' + edu.field : edu.degree}">Degree</div>
                        </div>
                    </div>
                </div>

                <!-- Skills -->
                <div class="section" th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <div class="section-title-table">
                        <h2 class="section-title-text">Skills</h2>
                        <div class="section-title-line"><div></div></div>
                    </div>
                    <div class="skills-table">
                        <div class="skills-col skills-col-left">
                            <div class="skill-group" th:each="entry, stat : ${groupedSkills}" th:if="${stat.index % 2 == 0}">
                                <div class="skill-group-name" th:text="${entry.key}">Category</div>
                                <div class="tags" style="margin-top:0;">
                                    <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}">Skill</span>
                                </div>
                            </div>
                        </div>
                        <div class="skills-col skills-col-right">
                            <div class="skill-group" th:each="entry, stat : ${groupedSkills}" th:if="${stat.index % 2 != 0}">
                                <div class="skill-group-name" th:text="${entry.key}">Category</div>
                                <div class="tags" style="margin-top:0;">
                                    <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}">Skill</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Languages -->
                <div class="section" th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                    <div class="section-title-table">
                        <h2 class="section-title-text">Languages</h2>
                        <div class="section-title-line"><div></div></div>
                    </div>
                    <div class="item-desc" th:text="${languagesStr}"></div>
                </div>

                <!-- Projects -->
                <div class="section" th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <div class="section-title-table">
                        <h2 class="section-title-text">Projects</h2>
                        <div class="section-title-line"><div></div></div>
                    </div>
                    <div class="item-list">
                        <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                            <div class="item-header">
                                <div class="item-title" th:text="${proj.name}">Project Name</div>
                                <div class="item-meta">
                                    <span th:if="${proj.githubUrl != null and !proj.githubUrl.isEmpty()}"><a th:href="${proj.githubUrl}" style="color: #8da191; text-decoration: none;" target="_blank">Git</a></span>
                                    <span th:if="${proj.githubUrl != null and !proj.githubUrl.isEmpty() and proj.liveUrl != null and !proj.liveUrl.isEmpty()}"> | </span>
                                    <span th:if="${proj.liveUrl != null and !proj.liveUrl.isEmpty()}"><a th:href="${proj.liveUrl}" style="color: #8da191; text-decoration: none;" target="_blank">Live</a></span>
                                </div>
                                <div class="clear"></div>
                            </div>
                            <div class="item-desc" th:text="${proj.description}">Description</div>
                            <div class="tags" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}">
                                <span class="tag" th:text="${proj.techStack}">Tech Stack</span>
                            </div>
                        </div>
                    </div>
                </div>
                
            </th:block>
        </th:block>
        
    </div>
</body>
</html>
