<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Milky Soft Style Resume</title>
    <style>
        @page { size: A4; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; font-size: 11px; line-height: 1.6; color: #3E3A37; }
        .master-table { width: 100%; border-collapse: collapse; height: 100%; min-height: 297mm; }
        .col-left { width: 35%; background-color: #F9F6F0; padding: 40px 25px; vertical-align: top; border-right: 1px solid #EBE6DF; }
        .col-right { width: 65%; background-color: #FFFFFF; padding: 40px 35px; vertical-align: top; }
        h1 { font-family: 'Georgia', serif; font-size: 32px; color: #3E3A37; margin: 0 0 10px 0; font-weight: normal; letter-spacing: 1px; }
        h2 { font-family: 'Georgia', serif; font-size: 16px; color: #8F7466; border-bottom: 1px solid #EBE6DF; padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; font-weight: normal; text-transform: uppercase; letter-spacing: 2px; }
        h2.left-title { border-bottom: 1px solid #D5CFC6; color: #3E3A37; }
        .contact-item { margin-bottom: 8px; font-size: 10px; color: #6D6863; }
        .contact-item a { color: #8F7466; text-decoration: none; }
        .tag { display: inline-block; background-color: #FFFFFF; border: 1px solid #D5CFC6; border-radius: 20px; padding: 4px 10px; margin-bottom: 6px; margin-right: 4px; font-size: 10px; color: #3E3A37; }
        .right-tag { display: inline-block; border-bottom: 1px solid #8F7466; font-size: 10px; color: #8F7466; margin-right: 8px; font-style: italic; }
        .item-wrap { margin-bottom: 20px; }
        .layout { width: 100%; border-collapse: collapse; margin-bottom: 2px; }
        .layout td { vertical-align: top; padding: 0; }
        .title { font-weight: bold; font-size: 14px; color: #3E3A37; }
        .date { text-align: right; font-size: 10px; color: #8F7466; }
        .subtitle { font-style: italic; font-size: 12px; color: #6D6863; margin-bottom: 6px; }
        .desc { font-size: 11px; color: #3E3A37; text-align: justify; }
        .lang-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 20px; }
        .lang-table td { padding: 4px 0; border-bottom: 1px solid #D5CFC6; }
    </style>
</head>
<body>
    <table class="master-table">
        <tr>
            <!-- LEFT COLUMN -->
            <td class="col-left">
                <!-- Contact Info -->
                <div class="contact-item" th:if="${profile.location}" th:text="${profile.location}"></div>
                <div class="contact-item" th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}"></a></div>
                <div class="contact-item" th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></div>
                <div class="contact-item" th:if="${profile.linkedin}"><span th:text="${profile.linkedin}"></span></div>
                <div class="contact-item" th:if="${profile.telegram}"><span th:text="${profile.telegram}"></span></div>
                
                <h2 class="left-title" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">Skills</h2>
                <div th:each="entry : ${groupedSkills}" style="margin-bottom: 10px;">
                    <strong style="display:block; margin-bottom:5px; font-size: 10px;" th:text="${entry.key}"></strong>
                    <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                </div>

                <h2 class="left-title" th:if="${languagesStr != null and !languagesStr.isEmpty()}">Languages</h2>
                <table class="lang-table">
                    <tr>
                        <td style="padding-bottom: 8px;" th:text="${languagesStr}"></td>
                    </tr>
                </table>
            </td>
            
            <!-- RIGHT COLUMN -->
            <td class="col-right">
                <h1 th:text="${profile.fullName}">Name</h1>
                
                <div th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                    <h2>Profile</h2>
                    <div class="desc" th:text="${profile.summary}"></div>
                </div>

                <div th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <h2>Experience</h2>
                    <div class="item-wrap" th:each="exp : ${profile.experience}">
                        <table class="layout">
                            <tr>
                                <td class="title" th:text="${exp.position}">Position</td>
                                <td class="date" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</td>
                            </tr>
                        </table>
                        <div class="subtitle" th:text="${exp.company}">Company</div>
                        <div class="desc" th:text="${exp.description}">Description</div>
                        <div th:if="${exp.techStack != null and !exp.techStack.isEmpty()}" style="margin-top: 5px;">
                            <span class="right-tag" th:text="${exp.techStack}"></span>
                        </div>
                    </div>
                </div>

                <div th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <h2>Education</h2>
                    <div class="item-wrap" th:each="edu : ${profile.education}">
                        <table class="layout">
                            <tr>
                                <td class="title" th:text="${edu.institution}">Institution</td>
                                <td class="date" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</td>
                            </tr>
                        </table>
                        <div class="subtitle" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                    </div>
                </div>

                <div th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <h2>Projects</h2>
                    <div class="item-wrap" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <table class="layout">
                            <tr>
                                <td class="title" th:text="${proj.name}">Project</td>
                                <td class="date">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}" style="color:#8F7466;">GitHub</a>
                                    <span th:if="${proj.githubUrl != null and proj.liveUrl != null}"> | </span>
                                    <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}" style="color:#8F7466;">Live</a>
                                </td>
                            </tr>
                        </table>
                        <div class="desc" th:text="${proj.description}">Description</div>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
