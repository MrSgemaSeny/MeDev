<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resume</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 40px; color: #333; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        h2 { font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 20px; }
        .contact-info { color: #666; font-size: 14px; margin-bottom: 20px; }
        .section-content { margin-top: 10px; }
        .exp-item { margin-bottom: 15px; }
        .exp-header { font-weight: bold; }
        .exp-date { color: #888; font-size: 12px; }
        .footer { margin-top: 40px; font-size: 10px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <h1 th:text="${profile.fullName}">John Doe</h1>
    <div class="contact-info">
        <span th:if="${profile.location}" th:text="${profile.location} + ' | '"></span>
        <span th:if="${profile.email}" th:text="${profile.email} + ' | '"></span>
        <span th:if="${profile.githubUsername}" th:text="'github.com/' + ${profile.githubUsername}"></span>
    </div>

    <div th:if="${profile.summary}">
        <h2>Summary</h2>
        <div class="section-content" th:text="${profile.summary}"></div>
    </div>

    <!-- Additional sections like Experience, Education, Skills will be added here -->

    <div class="footer">
        Generated by MeDev Platform on <span th:text="${generatedAt}"></span>
    </div>

</body>
</html>
