<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resume</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 40px; color: #333; line-height: 1.5; }
        h1 { font-size: 28px; margin-bottom: 5px; color: #333; text-align: left; }
        h2 { font-size: 14px; border-bottom: 1px solid #e5e7eb; padding-bottom: 3px; margin-top: 15px; margin-bottom: 8px; text-transform: uppercase; color: #555; }
        .contact-info { color: #666; font-size: 14px; margin-bottom: 25px; }
        .contact-info span { margin-right: 10px; }
        .section-content { margin-top: 10px; font-size: 14px; }
        .item { margin-bottom: 15px; }
        .item-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 3px; color: #222; }
        .item-subheader { font-style: italic; color: #666; font-size: 13px; margin-bottom: 5px; }
        .item-desc { font-size: 13.5px; color: #444; }
        .tech-stack { font-size: 12px; color: #777; margin-top: 4px; }
        .skills-list { font-size: 14px; line-height: 1.6; }
        .footer { margin-top: 40px; font-size: 10px; color: #aaa; text-align: center; border-top: 1px solid #eee; padding-top: 10px; }
        a { color: #0366d6; text-decoration: none; }
    </style>
</head>
<body>

    <h1 th:text="${profile.fullName}">Name</h1>
    <div class="contact-info">
        <span th:if="${profile.location}" th:text="${profile.location}"></span>
        <span th:if="${profile.website}"> | <a th:href="${profile.website}" th:text="${profile.website}"></a></span>
        <span th:if="${profile.githubUsername}"> | github.com/<span th:text="${profile.githubUsername}"></span></span>
        <span th:if="${profile.linkedin}"> | <span th:text="${profile.linkedin}"></span></span>
        <span th:if="${profile.telegram}"> | <span th:text="${profile.telegram}"></span></span>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null && !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
        
        <div th:switch="${sectionName}">
            
            <!-- SUMMARY -->
            <div th:case="'summary'" th:if="${profile.summary != null && !profile.summary.isEmpty()}">
                <h2>Summary</h2>
                <div class="section-content" th:text="${profile.summary}"></div>
            </div>

            <!-- EXPERIENCE -->
            <div th:case="'experience'" th:if="${profile.experience != null && !profile.experience.isEmpty()}">
                <h2>Experience</h2>
                <div class="section-content">
                    <div class="item" th:each="exp : ${profile.experience}">
                        <div class="item-header">
                            <span th:text="${exp.position}">Position</span>
                            <span th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</span>
                        </div>
                        <div class="item-subheader" th:text="${exp.company}">Company</div>
                        <div class="item-desc" th:text="${exp.description}">Description</div>
                        <div class="tech-stack" th:if="${exp.techStack}" th:text="'Tech: ' + ${exp.techStack}"></div>
                    </div>
                </div>
            </div>

            <!-- EDUCATION -->
            <div th:case="'education'" th:if="${profile.education != null && !profile.education.isEmpty()}">
                <h2>Education</h2>
                <div class="section-content">
                    <div class="item" th:each="edu : ${profile.education}">
                        <div class="item-header">
                            <span th:text="${edu.institution}">Institution</span>
                            <span th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</span>
                        </div>
                        <div class="item-subheader" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                    </div>
                </div>
            </div>

            <!-- SKILLS -->
            <div th:case="'skills'" th:if="${profile.skills != null && !profile.skills.isEmpty()}">
                <h2>Skills</h2>
                <div class="section-content skills-list">
                    <div th:each="skill : ${profile.skills}">
                        <strong th:text="${skill.category != null ? skill.category + ': ' : ''}"></strong>
                        <span th:text="${skill.name} + (${skill.level != null ? ' (' + skill.level + ')' : ''})"></span>
                    </div>
                </div>
            </div>

            <!-- LANGUAGES -->
            <div th:case="'languages'" th:if="${profile.languages != null && !profile.languages.isEmpty()}">
                <h2>Languages</h2>
                <div class="section-content skills-list">
                    <div th:each="lang : ${profile.languages}">
                        <strong th:text="${lang.name}"></strong><span th:if="${lang.level}" th:text="' - ' + ${lang.level}"></span>
                    </div>
                </div>
            </div>

            <!-- PROJECTS -->
            <div th:case="'projects'" th:if="${profile.projects != null && !profile.projects.isEmpty()}">
                <h2>Projects</h2>
                <div class="section-content">
                    <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <div class="item-header">
                            <span th:text="${proj.name}">Project Name</span>
                            <span>
                                <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}">GitHub</a>
                                <span th:if="${proj.githubUrl && proj.liveUrl}"> | </span>
                                <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}">Live</a>
                            </span>
                        </div>
                        <div class="item-desc" th:text="${proj.description}">Description</div>
                        <div class="tech-stack" th:if="${proj.techStack}" th:text="'Tech: ' + ${proj.techStack}"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="footer">
        Generated by MeDev Platform on <span th:text="${generatedAt}"></span>
    </div>

</body>
</html>
