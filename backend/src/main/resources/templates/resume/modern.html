<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Resume</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; color: #222; line-height: 1.5; }
        .header { background-color: #f8fafc; padding: 25px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #0ea5e9; }
        h1 { font-size: 36px; margin: 0 0 10px 0; color: #0f172a; font-weight: 800; letter-spacing: -0.5px; }
        .headline { font-size: 16px; color: #0ea5e9; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .contact-info { color: #64748b; font-size: 13px; display: flex; flex-wrap: wrap; gap: 15px; }
        .contact-info span { display: inline-block; margin-right: 15px; }
        h2 { font-size: 20px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 30px; margin-bottom: 15px; font-weight: 700; }
        .section-content { font-size: 14px; }
        .item { margin-bottom: 18px; }
        .item-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .item-title { font-weight: 700; font-size: 15px; color: #1e293b; }
        .item-date { font-size: 13px; color: #64748b; font-weight: 500; }
        .item-subtitle { font-weight: 600; color: #0ea5e9; font-size: 14px; margin-bottom: 6px; }
        .item-desc { color: #475569; font-size: 14px; line-height: 1.6; }
        .tech-stack { margin-top: 8px; font-size: 12px; }
        .tech-badge { background-color: #f1f5f9; color: #475569; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-right: 5px; margin-bottom: 5px; font-weight: 500; border: 1px solid #e2e8f0; }
        .skills-grid { display: block; }
        .skill-category { margin-bottom: 10px; }
        .skill-category-name { font-weight: 700; color: #0f172a; margin-right: 10px; width: 120px; display: inline-block; vertical-align: top; }
        .skill-list { display: inline-block; width: 75%; color: #475569; }
        .footer { margin-top: 50px; text-align: center; font-size: 11px; color: #94a3b8; }
        a { color: #0ea5e9; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1 th:text="${profile.fullName}">Name</h1>
        <div class="headline" th:if="${profile.headline}" th:text="${profile.headline}">Software Engineer</div>
        <div class="contact-info">
            <span th:if="${profile.location}" th:text="${profile.location}"></span>
            <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}"></a></span>
            <span th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}"><span th:text="${profile.linkedin}"></span></span>
            <span th:if="${profile.telegram}"><span th:text="${profile.telegram}"></span></span>
        </div>
    </div>

    <div th:each="sectionName : ${profile.sectionOrder != null && !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','projects','languages'}}">
        
        <div th:switch="${sectionName}">
            
            <!-- SUMMARY -->
            <div th:case="'summary'" th:if="${profile.summary != null && !profile.summary.isEmpty()}">
                <h2>Summary</h2>
                <div class="section-content item-desc" th:text="${profile.summary}"></div>
            </div>

            <!-- EXPERIENCE -->
            <div th:case="'experience'" th:if="${profile.experience != null && !profile.experience.isEmpty()}">
                <h2>Experience</h2>
                <div class="section-content">
                    <div class="item" th:each="exp : ${profile.experience}">
                        <div class="item-header">
                            <span class="item-title" th:text="${exp.position}">Position</span>
                            <span class="item-date" th:text="${exp.startDate + ' — ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</span>
                        </div>
                        <div class="item-subtitle" th:text="${exp.company}">Company</div>
                        <div class="item-desc" th:text="${exp.description}">Description</div>
                        <div class="tech-stack" th:if="${exp.techStack}">
                            <span class="tech-badge" th:each="tech : ${exp.techStack.split(',')}" th:text="${tech.trim()}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EDUCATION -->
            <div th:case="'education'" th:if="${profile.education != null && !profile.education.isEmpty()}">
                <h2>Education</h2>
                <div class="section-content">
                    <div class="item" th:each="edu : ${profile.education}">
                        <div class="item-header">
                            <span class="item-title" th:text="${edu.institution}">Institution</span>
                            <span class="item-date" th:text="${edu.startDate + ' — ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</span>
                        </div>
                        <div class="item-desc"><strong th:text="${edu.degree}"></strong><span th:if="${edu.field != null}" th:text="' in ' + ${edu.field}"></span></div>
                    </div>
                </div>
            </div>

            <!-- SKILLS -->
            <div th:case="'skills'" th:if="${profile.skills != null && !profile.skills.isEmpty()}">
                <h2>Skills & Technologies</h2>
                <div class="section-content skills-grid">
                    <div class="skill-category" th:each="skill : ${profile.skills}">
                        <span class="skill-category-name" th:text="${skill.category != null ? skill.category : 'Core'}"></span>
                        <span class="skill-list" th:text="${skill.name} + (${skill.level != null ? ' (' + skill.level + ')' : ''})"></span>
                    </div>
                </div>
            </div>

            <!-- PROJECTS -->
            <div th:case="'projects'" th:if="${profile.projects != null && !profile.projects.isEmpty()}">
                <h2>Projects</h2>
                <div class="section-content">
                    <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <div class="item-header">
                            <span class="item-title">
                                <span th:text="${proj.name}"></span>
                                <span style="font-weight: normal; font-size: 13px; margin-left: 10px;">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}">GitHub</a>
                                    <span th:if="${proj.githubUrl && proj.liveUrl}"> | </span>
                                    <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}">Live</a>
                                </span>
                            </span>
                        </div>
                        <div class="item-desc" th:text="${proj.description}">Description</div>
                        <div class="tech-stack" th:if="${proj.techStack}">
                            <span class="tech-badge" th:each="tech : ${proj.techStack.split(',')}" th:text="${tech.trim()}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LANGUAGES -->
            <div th:case="'languages'" th:if="${profile.languages != null && !profile.languages.isEmpty()}">
                <h2>Languages</h2>
                <div class="section-content">
                    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
                        <div th:each="lang : ${profile.languages}">
                            <strong th:text="${lang.name}"></strong><span style="color: #64748b;" th:if="${lang.level}" th:text="' — ' + ${lang.level}"></span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="footer">
        Generated by MeDev | devprofile.app
    </div>

</body>
</html>
