<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Orange Black Style Resume</title>
    <style>
        @page { size: A4; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #FFFFFF; color: #111111; margin: 0; padding: 0; font-size: 11px; line-height: 1.5; }
        .hero { background-color: #000000; padding: 40px; border-bottom: 5px solid #FFA31A; }
        .logo-wrap { font-size: 36px; font-weight: bold; font-family: 'Arial Black', Impact, sans-serif; letter-spacing: -1px; margin-bottom: 10px; }
        .logo-w1 { color: #FFFFFF; }
        .logo-w2 { background-color: #FFA31A; color: #000000; padding: 0 8px; border-radius: 4px; display: inline-block; }
        .contact { color: #AAAAAA; font-size: 11px; font-weight: bold; }
        .contact span { margin-right: 15px; }
        a { color: #FFA31A; text-decoration: none; }
        
        .content { padding: 30px 40px; }
        h2 { color: #000000; font-size: 16px; border-bottom: 2px solid #000000; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; text-transform: uppercase; font-family: 'Arial Black', Impact, sans-serif; }
        
        .layout { width: 100%; border-collapse: collapse; margin-bottom: 3px; }
        .layout td { vertical-align: top; padding: 0; }
        .left { text-align: left; font-weight: bold; font-size: 14px; color: #000000; }
        .right { text-align: right; font-size: 11px; color: #666666; font-weight: bold; }
        .item { margin-bottom: 20px; }
        .item-subheader { color: #FFA31A; font-weight: bold; font-size: 12px; margin-bottom: 5px; }
        .item-desc { font-size: 11px; color: #222222; }
        .tech-stack { color: #000000; font-size: 10px; font-weight: bold; margin-top: 5px; padding-left: 10px; border-left: 3px solid #FFA31A; }
        
        .skills-table { width: 100%; border-collapse: collapse; }
        .skills-table td { padding: 6px 0; vertical-align: top; border-bottom: 1px solid #EEEEEE; }
        .cat-col { width: 30%; color: #000000; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        .det-col { width: 70%; color: #444444; }
        .tag { display: inline-block; background-color: #EEEEEE; color: #000; padding: 2px 6px; font-weight: bold; font-size: 9px; margin-right: 4px; margin-bottom: 4px; }
        
        .footer { margin-top: 30px; font-size: 9px; color: #AAAAAA; text-align: center; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-wrap">
            <span class="logo-w1" th:text="${profile.fullName != null ? profile.fullName.split(' ')[0] : 'First'}">First</span><span th:if="${profile.fullName != null and profile.fullName.split(' ').length > 1}" class="logo-w2" th:text="${profile.fullName.substring(profile.fullName.indexOf(' ') + 1)}">Last</span>
        </div>
        <div class="contact">
            <span th:if="${profile.location}" th:text="${profile.location}"></span>
            <span th:if="${profile.website}"><a th:href="${profile.website}" th:text="${profile.website}"></a></span>
            <span th:if="${profile.githubUsername}">github.com/<span th:text="${profile.githubUsername}"></span></span>
            <span th:if="${profile.linkedin}">in/<span th:text="${profile.linkedin}"></span></span>
            <span th:if="${profile.telegram}">tg/<span th:text="${profile.telegram}"></span></span>
        </div>
    </div>

    <div class="content">
        <div th:each="sectionName : ${profile.sectionOrder != null and !profile.sectionOrder.isEmpty() ? profile.sectionOrder : {'summary','experience','education','skills','languages','projects'}}">
            <div th:switch="${sectionName}">
                
                <div th:case="'summary'" th:if="${profile.summary != null and !profile.summary.isEmpty()}">
                    <h2>Profile</h2>
                    <div class="item-desc" th:text="${profile.summary}" style="font-size: 13px; font-weight: bold;"></div>
                </div>

                <div th:case="'experience'" th:if="${profile.experience != null and !profile.experience.isEmpty()}">
                    <h2>Experience</h2>
                    <div class="item" th:each="exp : ${profile.experience}">
                        <table class="layout">
                            <tr>
                                <td class="left" th:text="${exp.position}">Position</td>
                                <td class="right" th:text="${exp.startDate + ' - ' + (exp.isCurrent ? 'Present' : exp.endDate)}">Date</td>
                            </tr>
                        </table>
                        <div class="item-subheader" th:text="${exp.company}">Company</div>
                        <div class="item-desc" th:text="${exp.description}">Description</div>
                        <div class="tech-stack" th:if="${exp.techStack != null and !exp.techStack.isEmpty()}" th:text="${exp.techStack}"></div>
                    </div>
                </div>

                <div th:case="'education'" th:if="${profile.education != null and !profile.education.isEmpty()}">
                    <h2>Education</h2>
                    <div class="item" th:each="edu : ${profile.education}">
                        <table class="layout">
                            <tr>
                                <td class="left" th:text="${edu.institution}">Institution</td>
                                <td class="right" th:text="${edu.startDate + ' - ' + (edu.isCurrent ? 'Present' : edu.endDate)}">Date</td>
                            </tr>
                        </table>
                        <div class="item-subheader" th:text="${edu.degree} + (edu.field != null ? ' in ' + edu.field : '')">Degree</div>
                    </div>
                </div>

                <div th:case="'skills'" th:if="${groupedSkills != null and !groupedSkills.isEmpty()}">
                    <h2>Skills</h2>
                    <table class="skills-table">
                        <tr th:each="entry : ${groupedSkills}">
                            <td class="cat-col" th:text="${entry.key}"></td>
                            <td class="det-col">
                                <span class="tag" th:each="skillName : ${entry.value}" th:text="${skillName}"></span>
                            </td>
                        </tr>
                    </table>
                </div>

                <div th:case="'languages'" th:if="${languagesStr != null and !languagesStr.isEmpty()}">
                    <h2>Languages</h2>
                    <table class="skills-table">
                        <tr>
                            <td class="cat-col">Languages</td>
                            <td class="det-col" style="font-weight: bold; color:#FFA31A;" th:text="${languagesStr}"></td>
                        </tr>
                    </table>
                </div>

                <div th:case="'projects'" th:if="${profile.projects != null and !profile.projects.isEmpty()}">
                    <h2>Projects</h2>
                    <div class="item" th:each="proj : ${profile.projects}" th:if="${proj.isVisible}">
                        <table class="layout">
                            <tr>
                                <td class="left" th:text="${proj.name}">Project Name</td>
                                <td class="right">
                                    <a th:if="${proj.githubUrl}" th:href="${proj.githubUrl}">[HUB]</a>
                                    <a th:if="${proj.liveUrl}" th:href="${proj.liveUrl}">[LIVE]</a>
                                </td>
                            </tr>
                        </table>
                        <div class="item-desc" th:text="${proj.description}">Description</div>
                        <div class="tech-stack" th:if="${proj.techStack != null and !proj.techStack.isEmpty()}" th:text="${proj.techStack}"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            POWERED BY MEDEV
        </div>
    </div>
</body>
</html>
